    (function() {
      var logError = function(type, e) {
        console.error("FATAL " + type + " DETECTED:", e);
        var errDiv = document.getElementById('sandboxed-error-hud');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'sandboxed-error-hud';
          errDiv.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;background:#fff1f2;color:#9f1239;border:3px solid #f43f5e;border-radius:16px;padding:20px;font-family:monospace;font-size:12px;font-weight:bold;z-index:9999999;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);max-height:85vh;overflow-y:auto;white-space:pre-wrap;text-align:left;line-height:1.5;';
          
          var title = document.createElement('div');
          title.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:start;"><span style="font-size:14px;display:flex;align-items:center;gap:8px;">⚠️ SYSTEM DIAGNOSTICS DETECTED (' + new Date().toLocaleTimeString() + ')</span><button onclick="this.parentElement.parentElement.parentElement.style.display=\'none\'" style="background:#e11d48;color:white;border:0;border-radius:4px;padding:2px 8px;cursor:pointer;">X</button></div><br><small style="color:#e11d48;font-weight:normal;">Kegagalan sistem terdeteksi pada perangkat ini. Dashboard mungkin tidak dapat dimuat dengan sempurna.</small><hr style="border:0;border-top:2px solid #fda4af;margin:12px 0;">';
          errDiv.appendChild(title);
          
          var pre = document.createElement('pre');
          pre.id = 'error-hud-content';
          pre.style.cssText = 'margin:0;font-family:inherit;font-size:inherit;color:inherit;background:#fff;padding:12px;border-radius:8px;border:1px solid #fecdd3;overflow-x:auto;';
          errDiv.appendChild(pre);
          
          document.body ? document.body.appendChild(errDiv) : document.documentElement.appendChild(errDiv);
        }
        var targetPre = document.getElementById('error-hud-content');
        if (targetPre) {
          var msg = e.message || e.reason || e;
          var stack = (e.error && e.error.stack) || (e.reason && e.reason.stack) || "No stack trace available";
          targetPre.textContent += '\n[' + type + '] ' + msg + '\n' + (stack !== "No stack trace available" ? '   Stack: ' + stack : '') + '\n';
        }
      };

      window.addEventListener('error', function(e) { logError("UI_ERROR", e); });
      window.addEventListener('unhandledrejection', function(e) { logError("PROMISE_REJECTION", e); });
      
      window.handleScriptError = function(scriptName, src) {
        logError("SCRIPT_LOAD_FAIL", "Gagal memuat library eksternal: " + scriptName + " (Source: " + src + "). Pastikan koneksi internet stabil dan tidak ada firewall yang memblokir CDN.");
        var loadMsg = document.getElementById('initial-loading-message');
        if (loadMsg) loadMsg.innerHTML = '<span style="color:#e11d48">❌ Gagal memuat library ' + scriptName + '. Refresh halaman atau hubungi tim IT.</span>';
      };
    })();
  </script>

        },
        {

        },

          name: 'Recharts',
          urls: [
            'https://cdn.jsdelivr.net/npm/recharts@2.12.7/dist/Recharts.min.js',
            'https://unpkg.com/recharts@2.12.7/dist/Recharts.min.js',

            'https://cdn.jsdelivr.net/npm/recharts@2.10.3/dist/Recharts.min.js'
          ],
          check: function() { 
            var r = window.Recharts || window.recharts;
            if (r && (r.BarChart || r.PieChart)) {
              window.Recharts = r; // Normalize
              return true;
            }
            return false;
          }
        },
        {
          name: 'Tailwind CSS',
          urls: [
            'https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4',
            'https://unpkg.com/@tailwindcss/browser@4'
          ],
          check: function() { return true; } 
        }
      ];

      function loadOne(libIndex) {
        if (libIndex >= libraries.length) {
          console.log("LOGISTICS_SYSTEM: All libraries loaded successfully.");
          return;
        }

        var lib = libraries[libIndex];
        var currentUrlIndex = 0;

        function tryNextUrl() {
          if (currentUrlIndex >= lib.urls.length) {
            console.error("FATAL: Failed to load " + lib.name + " from all CDNs.");
            var msg = document.getElementById('initial-loading-message');
            if (msg) msg.innerHTML = '<span style="color:#e11d48">❌ Gagal memuat library sistem: ' + lib.name + '. Periksa koneksi internet Anda.</span>';
            return;
          }

          var script = document.createElement('script');
          if (lib.type) script.type = lib.type;
          script.src = lib.urls[currentUrlIndex];
          script.async = false;
          script.onload = function() {
            if (lib.check()) {
               console.log("SYSTEM: " + lib.name + " LOADED.");
               loadOne(libIndex + 1);
            } else {
               currentUrlIndex++;
               tryNextUrl();
            }
          };
          script.onerror = function() {
            currentUrlIndex++;
            tryNextUrl();
          };
          document.head.appendChild(script);
        }

        tryNextUrl();
      }

      // Start sequential loading
      loadOne(0);

      // Manual Trigger for Babel when all is ready
      window.startApp = function() {
        if (typeof Babel !== 'undefined' && typeof React !== 'undefined') {
          console.log("BOOTSTRAP: Starting manual transformation...");
          
          // Ensure React and ReactDOM are explicitly globally available for the transformed scripts
          window.React = window.React;
          window.ReactDOM = window.ReactDOM;
          
          var scripts = document.querySelectorAll('script[data-type="text/babel"]');
          scripts.forEach(function(script) {
            try {
              var code = script.textContent || script.innerText;
              var output = Babel.transform(code, { 
                presets: [['react', { runtime: 'classic' }]],
                filename: 'app.jsx'
              }).code;
              
              var newScript = document.createElement('script');
              newScript.text = output;
              document.body.appendChild(newScript);
              console.log("BOOTSTRAP: Script transformed and executed.");
            } catch (err) {
              console.error("BOOTSTRAP ERROR:", err);
            }
          });
          
          // Remove loading overlay if JS rendered something
          var loading = document.getElementById('initial-loading-container');
          if (loading) {
            // Give React a moment to mount before hiding
            setTimeout(function() {
               var root = document.getElementById('root');
               if (!document.getElementById('initial-loading-container') || (root && root.children.length > 0 && !root.contains(loading))) {
                 loading.style.display = 'none';
               }
            }, 1000);
          }
        } else {
          console.warn("BOOTSTRAP: React/Babel not ready, retrying...");
          setTimeout(window.startApp, 200);
        }
      };
      
      // Override loadOne finalization
      var originalLoadOne = loadOne;
      loadOne = function(idx) {
        if (idx >= libraries.length) {
          console.log("LOGISTICS_SYSTEM: All libraries ready. Starting App...");
          setTimeout(window.startApp, 50);
          return;
        }
        originalLoadOne(idx);
      };
    })();
  </script>

        return acc;

    // Helper to format any datetime/time values cleanly
    const formatTimeValue = (val) => {
      if (!val) return '-';
      const str = String(val).trim();
      if (!str || str === '-') return '-';

      // If already a clean short time e.g., "11:58 AM" or "21:16"
      if (/^\d{1,2}:\d{2}\s*(AM|PM)?$/i.test(str)) {
        return str;
      }

      // Try parsing standard Date objects
      const d = new Date(str);
      if (!isNaN(d.getTime())) {
        const hours = String(d.getHours()).padStart(2, '0');
        const minutes = String(d.getMinutes()).padStart(2, '0');
        if (/AM|PM/i.test(str)) {
          let h = d.getHours();
          const ampm = h >= 12 ? 'PM' : 'AM';
          h = h % 12;
          h = h ? h : 12;
          return `${String(h).padStart(2, '0')}:${minutes} ${ampm}`;
        }
        return `${hours}:${minutes}`;
      }

      // Fallback regex match for hour/minute extraction
      const match = str.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i);
      if (match) {
        const hrs = String(match[1]).padStart(2, '0');
        const mins = match[2];
        const ampm = match[4] ? ' ' + match[4].toUpperCase() : '';
        return `${hrs}:${mins}${ampm}`;
      }

      return str;
    };

    // Helper function to safely parse dates from various spreadsheet formats
    const safeParseDateGlobal = (dateStr) => {
      if (!dateStr || dateStr === '-' || dateStr === '0') return null;
      
      // Attempt standard parsing first
      let d = new Date(dateStr);
      
      // If standard parsing fails (NaN), try manual D/M/Y parsing for Indonesian formats
      if (isNaN(d.getTime())) {
        // Match DD/MM/YYYY HH:mm or DD/MM/YYYY
        const dmyMatch = dateStr.match(/^(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{4})(.*)/);
        if (dmyMatch) {
          const day = parseInt(dmyMatch[1]);
          const month = parseInt(dmyMatch[2]) - 1; // 0-indexed month
          const year = parseInt(dmyMatch[3]);
          const timePart = dmyMatch[4] ? dmyMatch[4].trim() : '';
          
          d = new Date(year, month, day);
          
          if (timePart) {
            const tMatch = timePart.match(/(\d{1,2}):(\d{2})/);
            if (tMatch) {
               d.setHours(parseInt(tMatch[1]), parseInt(tMatch[2]), 0, 0);
               // Handle AM/PM if present
               if (timePart.toUpperCase().includes('PM') && parseInt(tMatch[1]) < 12) {
                 d.setHours(d.getHours() + 12);
               } else if (timePart.toUpperCase().includes('AM') && parseInt(tMatch[1]) === 12) {
                 d.setHours(0);
               }
            }
          }
        }
      }

      // Fallback for HH:mm format without date
      if (isNaN(d.getTime())) {
        const timeMatch = dateStr.match(/(\d{1,2}):(\d{2})/);
        if (timeMatch) {
          d = new Date();
          d.setHours(parseInt(timeMatch[1]), parseInt(timeMatch[2]), 0, 0);
          if (dateStr.toUpperCase().includes('PM') && parseInt(timeMatch[1]) < 12) d.setHours(d.getHours() + 12);
        }
      }
      
      return isNaN(d.getTime()) ? null : d;
    };

    const formatCountdownGlobal = (totalSeconds) => {
      if (totalSeconds === undefined || isNaN(totalSeconds)) return "00:00:00";
      const sign = totalSeconds < 0 ? "-" : "";
      const absSecs = Math.abs(Math.floor(totalSeconds));
      const h = Math.floor(absSecs / 3600);
      const m = Math.floor((absSecs % 3600) / 60);
      const s = absSecs % 60;
      return `${sign}${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    };

    // ========================================================
    // RE-USABLE ENRICHMENT & TIMING ENGINE
    // ========================================================
    function getEnrichedItem(item) {
      const checkinStr = item.checkin ? String(item.checkin).trim() : '';
      const openStr = item.open ? String(item.open).trim() : '';
      const closeStr = item.close ? String(item.close).trim() : '';
      const checkoutStr = item.checkout ? String(item.checkout).trim() : '';
      const plateStr = item.plateNumber ? String(item.plateNumber).trim() : '';

      // Determine Status based on checkpoints
      let computedStatus = 'BELUM DATANG';
      if ((closeStr !== '' && closeStr !== '-') || (checkoutStr !== '' && checkoutStr !== '-')) {
        computedStatus = 'SELESAI';
      } else if (openStr !== '' && openStr !== '-') {
        computedStatus = 'PROSES';
      } else if (checkinStr !== '' && checkinStr !== '-') {
        computedStatus = 'ANTRI';
      } else if (plateStr !== '' && plateStr !== '-') {
        computedStatus = 'ANTRI';
      } else {
        computedStatus = 'BELUM DATANG';
      }

      // Convert Targets & Calculate dynamic duration metrics
      const targetMin = Number(item.target || item.targetWaktu || 90);
      let realisasiMin = Number(item.realisasi) || 0;
      
      const openDate = safeParseDateGlobal(openStr);
      const closeDate = safeParseDateGlobal(closeStr) || safeParseDateGlobal(checkoutStr);

      // Calculate realisasi dynamically if is 0 but timestamps exist
      if (!realisasiMin && openDate && closeDate) {
        const diffMs = closeDate - openDate;
        if (diffMs > 0) {
          realisasiMin = Math.max(0, Math.round(diffMs / 60000));
        }
      }

      // Calculate dynamic remaining "WAKTU BERJALAN"
      let berjalanMin = Number(item.berjalan) || 0;
      if (computedStatus === 'SELESAI') {
        berjalanMin = targetMin - realisasiMin;
      } else if (computedStatus === 'PROSES' && openDate) {
        const elapsed = Math.round((new Date() - openDate) / 60000);
        berjalanMin = targetMin - elapsed;
      } else {
        berjalanMin = targetMin;
      }

      // Indicator logic: Ambil data langsung dari Kolom S (LEAD TIME LOADING) / item.indikator
      let rawInd = (item.indikator || '').toUpperCase().trim();
      let computedIndikator = 'ONTIME';
      if (rawInd) {
        if (rawInd.includes('OVER') || rawInd.includes('LATE') || rawInd.includes('WARNING') || rawInd.includes('-') || rawInd.includes('OVERTIME')) {
          computedIndikator = 'OVER SLA';
        } else {
          computedIndikator = 'ONTIME';
        }
      } else {
        // Fallback for mock items if they don't have explicit indicators
        const berjalanStr = String(item.berjalan || '');
        if (berjalanStr.includes('-')) {
          computedIndikator = 'OVER SLA';
        } else if (item.realisasi && item.target && Number(item.realisasi) > Number(item.target)) {
          computedIndikator = 'OVER SLA';
        } else {
          computedIndikator = 'ONTIME';
        }
      }

      const ldVal = item.ld !== undefined ? Number(item.ld) : (computedStatus === 'SELESAI' ? 100 : (computedStatus === 'PROSES' ? 50 : 0));
      let cbmVal = (item.cbm === null || item.cbm === undefined || isNaN(parseFloat(item.cbm))) ? 0 : parseFloat(item.cbm);

      // Normalize Batch values to match database expectations (B1, B2, B3, B4, CUSTOMER, CHATIME)
      let normalizedBatch = item.batch ? String(item.batch).toUpperCase().trim() : '';
      
      // BC/BC4 logic: directly map to CUSTOMER
      if (normalizedBatch === 'BC' || normalizedBatch === 'BC4') {
        normalizedBatch = 'CUSTOMER';
      }

      // Fallback: detect batch from destination if batch column is empty
      const dest = item.destination ? String(item.destination).toUpperCase().trim() : '';
      if (!normalizedBatch) {
        if (dest.startsWith('BC4') || dest.includes('CUSTOMER') || dest.startsWith('BC ')) {
          normalizedBatch = 'CUSTOMER';
        }
      }

      if (normalizedBatch === 'BATCH 1' || normalizedBatch === 'B1' || normalizedBatch.replace(/\s+/g, '') === 'BATCH1') {
        normalizedBatch = 'B1';
      } else if (normalizedBatch === 'BATCH 2' || normalizedBatch === 'B2' || normalizedBatch.replace(/\s+/g, '') === 'BATCH2') {
        normalizedBatch = 'B2';
      } else if (normalizedBatch === 'BATCH 3' || normalizedBatch === 'B3' || normalizedBatch.replace(/\s+/g, '') === 'BATCH3') {
        normalizedBatch = 'B3';
      } else if (normalizedBatch === 'BATCH 4' || normalizedBatch === 'B4' || normalizedBatch.replace(/\s+/g, '') === 'BATCH4') {
        normalizedBatch = 'B4';
      } else if (normalizedBatch === 'BATCH 5' || normalizedBatch === 'B5' || normalizedBatch.replace(/\s+/g, '') === 'BATCH5') {
        normalizedBatch = 'B5';
      } else if (normalizedBatch === 'BATCH 6' || normalizedBatch === 'B6' || normalizedBatch.replace(/\s+/g, '') === 'BATCH6') {
        normalizedBatch = 'B6';
      } else if (normalizedBatch.includes('CHATIME')) {
        normalizedBatch = 'CHATIME';
      } else if (normalizedBatch.includes('CUSTOMER')) {
        normalizedBatch = 'CUSTOMER';
      }

      return {
        ...item,
        status: computedStatus,
        realisasi: realisasiMin,
        target: targetMin,
        berjalan: berjalanMin,
        indikator: computedIndikator,
        ld: ldVal,
        cbm: cbmVal,
        batch: normalizedBatch || item.batch || ''
      };
    }

    function PintuView({ deliveries, setDeliveries, theme, showToast, filters }) {
      const [selectedPintu, setSelectedPintu] = useState(null);
      const [isDockModalOpen, setIsDockModalOpen] = useState(false);
      const [selectedDeliveryId, setSelectedDeliveryId] = useState("");

      const activeDate = filters?.tanggal || "ALL";
      const relevantDeliveries = useMemo(() => {
        if (activeDate === 'ALL') return deliveries;
        return deliveries.filter(d => d.tanggal === activeDate);
      }, [deliveries, activeDate]);

      // Helper function to match pintu names robustly
      const matchPintuName = (nameA, nameB) => {
        if (!nameA || !nameB) return false;
        const cleanA = String(nameA).trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
        const cleanB = String(nameB).trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (cleanA === cleanB) return true;
        
        // Match numbers, e.g. "1" and "PINTU1" or "P1" and "PINTU1"
        const numA = cleanA.match(/\d+$/);
        const numB = cleanB.match(/\d+$/);
        if (numA && numB && parseInt(numA[0]) === parseInt(numB[0])) {
          if (cleanA === numA[0] || cleanB === numB[0] || cleanA.startsWith('P') || cleanB.startsWith('P')) {
            return true;
          }
        }
        return false;
      };

      // Find trucks assigned to each pintu
      const getPintuActivity = (pintuName) => {
        // Active can look at the FULL deliveries array because if it is currently 'PROSES', it is physically occupying a gate right now!
        const active = deliveries.find(d => {
          const dPintu = d.pintu ? String(d.pintu).trim().toUpperCase() : '';
          const targetPintu = pintuName ? String(pintuName).trim().toUpperCase() : '';
          return (dPintu === targetPintu || matchPintuName(dPintu, targetPintu)) && d.status === 'PROSES';
        });
        const queue = relevantDeliveries.filter(d => {
          const dPintu = d.pintu ? String(d.pintu).trim().toUpperCase() : '';
          const targetPintu = pintuName ? String(pintuName).trim().toUpperCase() : '';
          return (dPintu === targetPintu || matchPintuName(dPintu, targetPintu)) && d.status === 'ANTRI';
        });
        const completed = relevantDeliveries.filter(d => {
          const dPintu = d.pintu ? String(d.pintu).trim().toUpperCase() : '';
          const targetPintu = pintuName ? String(pintuName).trim().toUpperCase() : '';
          return (dPintu === targetPintu || matchPintuName(dPintu, targetPintu)) && d.status === 'SELESAI';
        });
        return { active, queue, completed };
      };

      // Find trucks that are checked-in but not yet docked/loading, or are ANTRI but can be assigned to this pintu
      const standbyTrucks = relevantDeliveries.filter(d => d.status === 'ANTRI' || !d.pintu);
      const prosesTrucks = deliveries.filter(d => d.status === 'PROSES');

      const handleDockerAssign = (e) => {
        e.preventDefault();
        const activeTargetPintu = selectedPintu || "PINTU 1";
        if (!selectedDeliveryId) {
          showToast("Pilih salah satu armada untuk didocking!", "error");
          return;
        }

        const isGoogleScript = typeof google !== 'undefined' && google.script && google.script.run;
        const now = new Date();
        const timeStr = now.toLocaleString('en-US', { hour: 'numeric', minute: 'numeric', hour12: true });

        const updated = deliveries.map(d => {
          if (d.id === selectedDeliveryId) {
            return {
              ...d,
              pintu: activeTargetPintu,
              status: 'PROSES',
              open: d.open || `${now.getMonth() + 1}/${now.getDate()}/${now.getFullYear()} ${timeStr}`
            };
          }
          return d;
        });

        if (isGoogleScript) {
          showToast("Menyimpan ke Google Sheet...", "info");
          google.script.run
            .withSuccessHandler(() => {
              setDeliveries(updated);
              showToast(`Armada berhasil didocking ke ${activeTargetPintu} di Google Sheet!`);
            })
            .withFailureHandler((err) => {
              showToast("Gagal docking ke Google Sheet: " + err, "error");
            })
            .assignDeliveryToPintu(selectedDeliveryId, activeTargetPintu, 'PROSES');
        } else {
          setDeliveries(updated);
          safeLocalStorage.setItem('kawanlama_deliveries', JSON.stringify(updated));
          showToast(`Armada berhasil didocking ke ${activeTargetPintu} dan status mulai PROSES LOADING!`);
        }

        setIsDockModalOpen(false);
        setSelectedPintu(null);
        setSelectedDeliveryId("");
      };

      const handleCloseLoading = (deliveryId) => {
        const isGoogleScript = typeof google !== 'undefined' && google.script && google.script.run;
        const now = new Date();
        const timeStr = now.toLocaleString('en-US', { hour: 'numeric', minute: 'numeric', hour12: true });
        
        const updated = deliveries.map(d => {
          if (d.id === deliveryId) {
            return {
              ...d,
              status: 'SELESAI',
              close: d.close || `${now.getMonth() + 1}/${now.getDate()}/${now.getFullYear()} ${timeStr}`
            };
          }
          return d;
        });

        if (isGoogleScript) {
          showToast("Menyimpan status selesai ke Google Sheet...", "info");
          google.script.run
            .withSuccessHandler(() => {
              setDeliveries(updated);
              showToast("Proses loading selesai. Pintu loading dibebaskan!");
            })
            .withFailureHandler((err) => {
              showToast("Gagal melepaskan pintu loading: " + err, "error");
            })
            .updateDeliveryStatus(deliveryId, 'SELESAI');
        } else {
          setDeliveries(updated);
          safeLocalStorage.setItem('kawanlama_deliveries', JSON.stringify(updated));
          showToast(`Proses loading armada selesai. Pintu loading dibebaskan!`);
        }
      };

      // Derivasi daftar pintu secara dinamis dari data database (Kolom U)
      const visiblePintus = useMemo(() => {
        const defaultPintus = [
          'PINTU 1', 'PINTU 2', 'PINTU 3', 'PINTU 4', 'PINTU 5',
          'PINTU 6', 'PINTU 7', 'PINTU 8', 'PINTU 10', 'PINTU 11',
          'PINTU 12', 'PINTU 13', 'PINTU 14', 'PINTU 15'
        ];
        const list = [...defaultPintus];
        deliveries.forEach(d => {
          if (d.pintu && String(d.pintu).trim()) {
            const p = String(d.pintu).trim().toUpperCase();
            if (p && !p.includes('PINTU 9') && !p.includes('GATE 9') && p !== '9') {
              const alreadyExists = list.some(existing => matchPintuName(existing, p));
              if (!alreadyExists) {
                list.push(p);
              }
            }
          }
        });
        
        return list.sort((a, b) => {
          const numA = parseInt(a.replace(/\D/g, '')) || 0;
          const numB = parseInt(b.replace(/\D/g, '')) || 0;
          return numA - numB;
        });
      }, [deliveries]);

      // Gates stats
      const occupiedCount = visiblePintus.filter(p => getPintuActivity(p).active).length;
      const queueCount = relevantDeliveries.filter(d => d.status === 'ANTRI').length;
      const idleCount = visiblePintus.length - occupiedCount;

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white border border-slate-100 p-3 rounded-xl shadow-sm">
            <div>
              <h2 className="text-sm font-black text-slate-800 flex flex-wrap items-center gap-2 uppercase tracking-wide">
                <span>🚪 Gate Monitor</span>
                <span className="text-[9px] bg-emerald-500/15 text-[#0a5e3a] border border-emerald-500/20 px-1.5 py-0.5 rounded-full font-black uppercase tracking-widest leading-none">DMS</span>
                <span className="text-[9px] bg-sky-500/15 text-sky-700 border border-sky-500/20 px-1.5 py-0.5 rounded-full font-black uppercase tracking-widest leading-none">TGL: {activeDate === 'ALL' ? 'Semua' : activeDate}</span>
              </h2>
            </div>
            
            <div className="flex items-center gap-2">
              <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping" />
              <span className="text-[9px] font-black text-slate-400 uppercase tracking-widest">Live</span>
            </div>
          </div>

          {/* Quick Stats Grid */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div className="bg-white border border-slate-100 p-3 rounded-xl flex flex-col justify-between">
              <span className="text-[9px] font-black tracking-widest text-rose-650 uppercase">PROSES</span>
              <div className="flex items-baseline gap-1.5 mt-1">
                <span className="text-xl font-black font-mono text-rose-650">{occupiedCount}</span>
                <span className="text-[10px] font-semibold text-slate-400">Pintu</span>
              </div>
            </div>
            <div className="bg-white border border-slate-100 p-3 rounded-xl flex flex-col justify-between">
              <span className="text-[9px] font-black tracking-widest text-[#0a5e3a] uppercase font-sans">Standby</span>
              <div className="flex items-baseline gap-1.5 mt-1">
                <span className="text-xl font-black font-mono text-[#0a5e3a]">{idleCount}</span>
                <span className="text-[10px] font-semibold text-slate-400">Pintu</span>
              </div>
            </div>
            <div className="bg-white border border-slate-100 p-3 rounded-xl flex flex-col justify-between">
              <span className="text-[9px] font-black tracking-widest text-amber-600 uppercase font-sans">Waiting</span>
              <div className="flex items-baseline gap-1.5 mt-1">
                <span className="text-xl font-black font-mono text-amber-500">{queueCount}</span>
                <span className="text-[10px] font-semibold text-slate-400">Antre</span>
              </div>
            </div>
          </div>

          {/* Gates Bento layout */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {[...visiblePintus].sort((a, b) => {
              const isAProses = !!getPintuActivity(a).active;
              const isBProses = !!getPintuActivity(b).active;
              if (isAProses && !isBProses) return -1;
              if (!isAProses && isBProses) return 1;
              
              const numA = parseInt(a.replace(/\D/g, '')) || 0;
              const numB = parseInt(b.replace(/\D/g, '')) || 0;
              return numA - numB;
            }).map(pName => {
              const { active, queue, completed } = getPintuActivity(pName);
              return (
                <PintuGateCard 
                  key={pName}
                  pName={pName}
                  active={active}
                  queue={queue}
                  completed={completed}
                  isProses={!!active}
                  handleCloseLoading={handleCloseLoading}
                  handleOpenDockModal={(pName) => { setSelectedPintu(pName); setIsDockModalOpen(true); }}
                  showToast={showToast}
                />
              );
            })}
          </div>

          {/* Active Loading Queue Panel (Sedang Proses) */}
          <div className="bg-white dark:bg-slate-900 border border-emerald-500/20 dark:border-emerald-950/50 rounded-3xl p-5 shadow-xs bg-emerald-50/5">
            <h3 className="text-xs font-black uppercase text-[#0a5e3a] dark:text-emerald-400 tracking-wider mb-4 flex items-center justify-between">
              <div className="flex items-center gap-1.5">
                <span>⚡</span> Armada Sedang Proses Loading (Active Docking Zone)
              </div>
              <span className="text-[10px] bg-emerald-105 dark:bg-emerald-950/80 px-2 py-0.5 rounded-full font-black text-[#0a5e3a] dark:text-emerald-300">
                {prosesTrucks.length} BERJALAN
              </span>
            </h3>
            
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs font-semibold">
                <thead className="bg-[#f0fdf4] dark:bg-emerald-950/30 border-b border-emerald-100 dark:border-emerald-950 text-[10px] font-black text-[#0a5e3a] dark:text-emerald-450 uppercase tracking-widest">
                  <tr>
                    <th className="py-3 px-4 font-mono">ID LC</th>
                    <th className="py-3 px-4 font-mono">PLATE NUMBER</th>
                    <th className="py-3 px-4">VEHICLE TYPE</th>
                    <th className="py-3 px-4">DOCKING GATE</th>
                    <th className="py-3 px-4">TUJUAN DISTRIBUSI</th>
                    <th className="py-3 px-4">BATCH</th>
                    <th className="py-3 px-4 text-center">MULAI</th>
                    <th className="py-3 px-4 text-center font-bold">LOADER</th>
                    <th className="py-3 px-4 text-center my-auto">TINDAKAN</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 dark:divide-slate-850 font-medium text-slate-700 dark:text-slate-300">
                  {prosesTrucks.map(truck => (
                    <tr key={truck.id} className="hover:bg-emerald-50/10 dark:hover:bg-emerald-950/5">
                      <td className="py-3 px-4 font-mono font-bold text-rose-650 dark:text-rose-400">{truck.id}</td>
                      <td className="py-3 px-4 font-mono font-semibold text-slate-850 dark:text-white">
                        <div className="flex items-center gap-1.5">
                          <span className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-ping" />
                          {truck.plateNumber || 'TBA'}
                        </div>
                      </td>
                      <td className="py-3 px-4">
                        <span className="px-2 py-0.5 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-550 dark:text-slate-405 rounded font-bold font-mono text-[10.5px]">
                          {truck.vehicleType}
                        </span>
                      </td>
                      <td className="py-3 px-4">
                        <span className="px-2.5 py-0.5 bg-emerald-500/10 text-[#0a5e3a] dark:text-emerald-400 border border-emerald-500/20 rounded-full font-black text-[11px] font-mono">
                          {truck.pintu || 'BELUM DIATUR'}
                        </span>
                      </td>
                      <td className="py-3 px-4 truncate max-w-[180px]" title={truck.destination}>{truck.destination}</td>
                      <td className="py-3 px-4">{truck.batch}</td>
                      <td className="py-3 px-4 text-center font-mono text-emerald-600 dark:text-emerald-400 text-[11px] font-bold">{formatTimeValue(truck.open)}</td>
                      <td className="py-3 px-4 text-center font-mono text-slate-500 dark:text-slate-400 text-[11px]" title={[truck.loader1, truck.loader2, truck.loader3].filter(Boolean).join(", ")}>
                        {[truck.loader1, truck.loader2, truck.loader3].filter(Boolean).join(", ") || '-'}
                      </td>
                      <td className="py-3 px-4 text-center">
                        <button 
                          onClick={() => handleCloseLoading(truck.id)}
                          className="px-2.5 py-1 bg-[#0ea5e9] hover:bg-sky-600 text-white rounded-lg text-[10px] font-black active:scale-95 transition cursor-pointer"
                        >
                          Proses Loading
                        </button>
                      </td>
                    </tr>
                  ))}
                  {prosesTrucks.length === 0 && (
                    <tr>
                      <td colSpan="9" className="py-8 text-center text-slate-405 dark:text-slate-500 font-bold uppercase tracking-wider">
                        Tidak ada armada yang sedang dimuat saat ini.
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {/* Standby Queue Panel */}
          <div className="bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-3xl p-5 shadow-xs">
            <h3 className="text-xs font-black uppercase text-slate-800 dark:text-emerald-100 tracking-wider mb-4 flex items-center gap-1.5">
              <span>🗂️</span> Antrean Armada Belum Dok (Standby Zone)
            </h3>
            
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs font-semibold">
                <thead className="bg-slate-50 dark:bg-slate-950/60 border-b border-slate-100 dark:border-slate-850 text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest">
                  <tr>
                    <th className="py-3 px-4 font-mono">ID LC</th>
                    <th className="py-3 px-4 font-mono">PLATE NUMBER</th>
                    <th className="py-3 px-4">VEHICLE TYPE</th>
                    <th className="py-3 px-4">TUJUAN DISTRIBUSI</th>
                    <th className="py-3 px-4">BATCH</th>
                    <th className="py-3 px-4 text-center">CHECK-IN</th>
                    <th className="py-3 px-4 text-center">ACTION</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-50 dark:divide-slate-850 font-medium text-slate-700 dark:text-slate-300">
                  {standbyTrucks.map(truck => (
                    <tr key={truck.id} className="hover:bg-slate-50/20">
                      <td className="py-3 px-4 font-mono font-bold text-rose-650 dark:text-rose-400">{truck.id}</td>
                      <td className="py-3 px-4 font-mono font-bold text-slate-850 dark:text-white">{truck.plateNumber || 'BELUM TERDAFTAR'}</td>
                      <td className="py-3 px-4">
                        <span className="px-2 py-0.5 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-550 dark:text-slate-405 rounded font-bold font-mono text-[10.5px]">
                          {truck.vehicleType}
                        </span>
                      </td>
                      <td className="py-3 px-4 truncate max-w-[200px]" title={truck.destination}>{truck.destination}</td>
                      <td className="py-3 px-4">{truck.batch}</td>
                      <td className="py-3 px-4 text-center font-mono text-slate-500 text-[11px]">{truck.checkin || '-'}</td>
                      <td className="py-3 px-4 text-center">
                        <button 
                          onClick={() => { setSelectedPintu("PINTU 1"); setSelectedDeliveryId(truck.id); setIsDockModalOpen(true); }}
                          className="px-2.5 py-1 bg-[#0a5e3a] hover:bg-[#084b2e] text-white rounded-lg text-[10px] font-black active:scale-95 transition"
                        >
                          Arahkan Pintu
                        </button>
                      </td>
                    </tr>
                  ))}
                  {standbyTrucks.length === 0 && (
                    <tr>
                      <td colSpan="7" className="py-8 text-center text-slate-400 dark:text-slate-500 font-bold uppercase tracking-wider">
                        Tidak ada armada dalam antrean standby zone. Semuaya telah didocking!
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {/* Docking Assignment Modal */}
          {isDockModalOpen && (
            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-205 dark:border-slate-800 rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl">
                <div className="px-5 py-3.5 bg-slate-50 dark:bg-slate-950/50 border-b border-slate-100 dark:border-slate-850 flex items-center justify-between">
                  <h3 className="font-extrabold text-xs text-slate-800 dark:text-white uppercase tracking-wider">Docking Armada / Arahkan Pintu</h3>
                  <button onClick={() => { setIsDockModalOpen(false); setSelectedPintu(null); setSelectedDeliveryId(""); }} className="text-slate-400 hover:text-slate-600">
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
                  </button>
                </div>
                <form onSubmit={handleDockerAssign} className="p-5 space-y-4">
                  <div>
                    <label className="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Pintu Loading Dermaga</label>
                    <select 
                      value={selectedPintu || "PINTU 1"} 
                      onChange={e => setSelectedPintu(e.target.value)}
                      className="w-full px-3.5 py-2 text-xs border border-slate-200 dark:border-slate-700 dark:bg-slate-950 rounded-xl outline-none font-bold text-slate-800 dark:text-slate-100"
                    >
                      {visiblePintus.map(pt => (
                        <option key={pt} value={pt}>{pt}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Pilih Armada (Antrean / Standby)</label>
                    <select 
                      value={selectedDeliveryId} 
                      onChange={e => setSelectedDeliveryId(e.target.value)}
                      className="w-full px-3.5 py-2 text-xs border border-slate-200 dark:border-slate-700 dark:bg-slate-950 rounded-xl outline-none font-mono font-bold text-slate-800 dark:text-slate-100"
                    >
                      <option value="">-- PILIH ARMADA NOPOL --</option>
                      {standbyTrucks.map(truck => (
                        <option key={truck.id} value={truck.id}>
                          {truck.plateNumber || 'TBA'} ({truck.vehicleType}) - {truck.destination.substring(0, 30)}...
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="flex items-center justify-end gap-2.5 pt-3">
                    <button type="button" onClick={() => { setIsDockModalOpen(false); setSelectedPintu(null); setSelectedDeliveryId(""); }} className="px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-350 rounded-xl text-xs font-bold">Batalkan</button>
                    <button type="submit" className="px-5 py-2 bg-[#0a5e3a] hover:bg-[#084b2e] text-white rounded-xl text-xs font-extrabold shadow-md">Hubungkan & Docking</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }


    // ==========================================
    // SUBVIEW: PRODUKTIVITI LOADING DASHBOARD
    // ==========================================
    function RekapProductivityView({ data, theme }) {
      if (!data || data.length === 0) {
        return (
          <div className="flex flex-col items-center justify-center p-20 bg-white dark:bg-slate-900 rounded-3xl border border-dashed border-slate-300 dark:border-slate-700 animate-pulse">
            <RefreshIcon className="w-12 h-12 text-blue-500 animate-spin mb-4" />
            <p className="text-slate-500 font-bold uppercase tracking-widest text-xs">Memuat Data Produktivitas...</p>
          </div>
        );
      }

      // Process Data for Analytics
      const processedData = useMemo(() => {
        if (!data || data.length === 0) return [];
        const headers = Object.keys(data[0]);
        
        return data.map(row => {
          // Identify columns by position or name
          // Map based on user spec: B=NIK, C=Nama, D=Tugas, E-AH=Harian
          // In the object, keys are header strings
          const rowValues = Object.values(row);
          const nik = rowValues[1];
          const nama = rowValues[2];
          const tugas = rowValues[3];
          
          let totalCbm = 0;
          let daysCount = 0;
          const dailyCbm = [];

          // Indices 4 onwards are daily CBM values
          for (let i = 4; i < rowValues.length; i++) {
            const val = parseFloat(rowValues[i]) || 0;
            dailyCbm.push(val);
            if (val > 0) {
              totalCbm += val;
              daysCount++;
            }
          }

          const averageCbm = daysCount > 0 ? totalCbm / daysCount : 0;

          return {
            ...row,
            _nik: nik,
            _nama: nama,
            _tugas: tugas,
            _totalCbm: totalCbm,
            _averageCbm: averageCbm,
            _daysCount: daysCount,
            _dailyCbm: dailyCbm
          };
        });
      }, [data]);

      // Filter Top 5 for specific tasks
      const topLoaderOutbound = useMemo(() => {
        return processedData
          .filter(item => {
            const t = String(item._tugas || '').toUpperCase();
            return t.includes('LOADER') || t.includes('OUTBOUND');
          })

    // ==========================================
    // SUBVIEW: PENYIMPANGAN PICKING (PICK DISCREPANCY)
    // ==========================================
    function PenyimpanganPickingView({ theme, showToast }) {
      const defaultValue = [
        { id: "ERR-001", orderId: "ORD-9905", pickerName: "Rizky Fauzi", zone: "ZONE A (RACK-07)", sku: "KB-20121", itemName: "Krisbow Steel Tool Box 18 Inch", qtyOrder: 80, qtyRealisasi: 76, selisih: -4, type: "SHORT PICK", status: "OPEN", reportedTime: "04/06/2026 09:12 AM" },
        { id: "ERR-002", orderId: "ORD-9912", pickerName: "Yudi Haryono", zone: "ZONE B (RACK-12)", sku: "AH-44019", itemName: "Ace Digital Safe Box Medium", qtyOrder: 30, qtyRealisasi: 30, selisih: 0, type: "DAMAGED", status: "INVESTIGATED", reportedTime: "04/06/2026 10:05 AM" },
        { id: "ERR-003", orderId: "ORD-9925", pickerName: "Slamet Santoso", zone: "ZONE C (BULK)", sku: "IF-50121", itemName: "Informa Dining Table Wood", qtyOrder: 10, qtyRealisasi: 11, selisih: 1, type: "OVER PICK", status: "RESOLVED", reportedTime: "03/06/2026 04:30 PM" },
        { id: "ERR-004", orderId: "ORD-9930", pickerName: "Anang Ma'ruf", zone: "ZONE A (RACK-02)", sku: "KB-88271", itemName: "Krisbow High Pressure Cleaner v4", qtyOrder: 40, qtyRealisasi: 38, selisih: -2, type: "SHORT PICK", status: "OPEN", reportedTime: "04/06/2026 12:45 PM" }
      ];

      const [deviations, setDeviations] = useState(() => {
        const stored = safeLocalStorage.getItem('kawanlama_deviations');
        return stored ? JSON.parse(stored) : defaultValue;
      });

      const [searchQuery, setSearchQuery] = useState("");
      const [filterType, setFilterType] = useState("ALL");
      const [isFormOpen, setIsFormOpen] = useState(false);

      const [newDeviation, setNewDeviation] = useState({
        orderId: "",
        pickerName: "Rizky Fauzi",
        zone: "ZONE A (RACK-07)",
        sku: "",
        itemName: "",
        qtyOrder: "",
        qtyRealisasi: "",
        type: "SHORT PICK"
      });

      useEffect(() => {
        safeLocalStorage.setItem('kawanlama_deviations', JSON.stringify(deviations));
      }, [deviations]);

      const handleAdd = (e) => {
        e.preventDefault();
        const ord = parseInt(newDeviation.qtyOrder);
        const real = parseInt(newDeviation.qtyRealisasi);
        if (!newDeviation.orderId || !newDeviation.sku || !newDeviation.itemName || isNaN(ord) || isNaN(real)) {
          showToast("Form input belum lengkap atau tidak valid!", "error");
          return;
        }

        const calculatedDiff = real - ord;
        let determinedType = newDeviation.type;
        
        // Auto validate deviation type
        if (determinedType === 'SHORT PICK' && calculatedDiff >= 0) {
          showToast("Realisasi pick harus kurang dari order untuk SHORT PICK", "error");
          return;
        }
        if (determinedType === 'OVER PICK' && calculatedDiff <= 0) {
          showToast("Realisasi pick harus lebih besar dari order untuk OVER PICK", "error");
          return;
        }

        const now = new Date();
        const timeStr = `${now.toLocaleDateString('id-ID')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        const added = {
          id: "ERR-" + String(deviations.length + 1).padStart(3, '0'),
          orderId: newDeviation.orderId.toUpperCase(),
          pickerName: newDeviation.pickerName,
          zone: newDeviation.zone,
          sku: newDeviation.sku.toUpperCase(),
          itemName: newDeviation.itemName,
          qtyOrder: ord,
          qtyRealisasi: real,
          selisih: calculatedDiff,
          type: determinedType,
          status: "OPEN",
          reportedTime: timeStr
        };

        setDeviations([added, ...deviations]);
        setIsFormOpen(false);
        setNewDeviation({
          orderId: "",
          pickerName: "Rizky Fauzi",
          zone: "ZONE A (RACK-07)",
          sku: "",
          itemName: "",
          qtyOrder: "",
          qtyRealisasi: "",
          type: "SHORT PICK"
        });
        showToast("Tindak lanjut penyimpangan picking dilaporkan!");
      };

      const handleStatusChange = (id, newStatus) => {
        const updated = deviations.map(d => {
          if (d.id === id) {
            return { ...d, status: newStatus };
          }
          return d;
        });
        setDeviations(updated);
        showToast(`Status discrepancy berhasil diperbarui ke ${newStatus}`);
      };

      const handleDelete = (id) => {
        if (!confirm("Hapus laporan discrepancy ini?")) return;
        setDeviations(deviations.filter(d => d.id !== id));
        showToast("Laporan pick discrepancy dihapus");
      };

      const filteredDeviations = deviations.filter(d => {
        const matchesSearch = 
          d.orderId.toLowerCase().includes(searchQuery.toLowerCase()) ||
          d.pickerName.toLowerCase().includes(searchQuery.toLowerCase()) ||
          d.sku.toLowerCase().includes(searchQuery.toLowerCase()) ||
          d.itemName.toLowerCase().includes(searchQuery.toLowerCase());
        
        const matchesType = filterType === 'ALL' || d.type === filterType;
        return matchesSearch && matchesType;
      });

      // KPI metrics
      const totalOpen = deviations.filter(d => d.status === 'OPEN').length;
      const totalShort = deviations.filter(d => d.type === 'SHORT PICK').length;
      const totalDamaged = deviations.filter(d => d.type === 'DAMAGED').length;

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white dark:bg-slate-900 border border-slate-105 dark:border-emerald-900/40 p-5 rounded-2xl shadow-sm transition">
            <div>
              <h2 className="text-lg font-black text-slate-800 dark:text-emerald-100 flex items-center gap-2 uppercase tracking-wide">
                ⚠️ Penyimpangan Picking (Discrepancy)
                <span className="text-[10px] bg-red-500/10 text-red-652 dark:text-red-420 border border-red-500/20 px-2 py-0.5 rounded-full font-black uppercase tracking-widest leading-none">Pick Discrepancy</span>
              </h2>

    // Helper to get today's date in DD/MM/YYYY format
    const getTodayDateString = () => {
      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();
      return `${dd}/${mm}/${yyyy}`;
    };

    // Helper to extract Month from Date (e.g., DD/MM/YYYY or YYYY-MM-DD or standard Date)
    const getMonthFromDate = (dateStr) => {
      if (!dateStr) return null;
      var str = String(dateStr).trim();
      
      // 1. Check DD/MM/YYYY
      if (str.includes('/')) {
        const parts = str.split('/');
        if (parts.length === 3) {
          const monthIndex = parseInt(parts[1], 10) - 1; // 0-based
          const year = parts[2];
          const monthNames = [
            "Januari", "Februari", "Maret", "April", "Mei", "Juni",
            "Juli", "Agustus", "September", "Oktober", "November", "Desember"
          ];
          if (monthIndex >= 0 && monthIndex < 12) {
            return {
              key: `${parts[1].padStart(2, '0')}-${year}`, // e.g. "05-2026"
              name: `${monthNames[monthIndex]} ${year}`,
              monthIndex,
              year: parseInt(year, 10)
            };
          }
        }
      }
      
      // 2. Check YYYY-MM-DD or DD-MM-YYYY
      if (str.includes('-')) {
        const parts = str.split('-');
        if (parts.length === 3) {
          let year, monthStr;
          if (parts[0].length === 4) { // YYYY-MM-DD
            year = parts[0];
            monthStr = parts[1];
          } else { // DD-MM-YYYY
            year = parts[2];
            monthStr = parts[1];
          }
          const monthIndex = parseInt(monthStr, 10) - 1;
          const monthNames = [
            "Januari", "Februari", "Maret", "April", "Mei", "Juni",
            "Juli", "Agustus", "September", "Oktober", "November", "Desember"
          ];
          if (monthIndex >= 0 && monthIndex < 12) {
            return {
              key: `${monthStr.padStart(2, '0')}-${year}`,
              name: `${monthNames[monthIndex]} ${year}`,
              monthIndex,
              year: parseInt(year, 10)
            };
          }
        }
      }
      
      // Fallback
      const parsedDate = new Date(str);
      if (!isNaN(parsedDate.getTime())) {
        const mIdx = parsedDate.getMonth();
        const yVal = parsedDate.getFullYear();
        const monthNames = [
          "Januari", "Februari", "Maret", "April", "Mei", "Juni",
          "Juli", "Agustus", "September", "Oktober", "November", "Desember"
        ];
        return {
          key: `${String(mIdx + 1).padStart(2, '0')}-${yVal}`,
          name: `${monthNames[mIdx]} ${yVal}`,
          monthIndex: mIdx,
          year: yVal
        };
      }
      return null;
    };


    // Helper to evaluate smart vehicle type matching for the 9 core categories
    const matchVehicleType = (dVehicleType, filterType) => {
      if (!filterType || filterType === 'ALL') return true;
      const f = filterType.toUpperCase().trim();
      const v = (dVehicleType || '').toUpperCase().trim();
      if (f === 'WINGBOX') {
        return v.includes('WINGBOX');
      } else if (f === 'CONTAINER 40') {
        return v.includes('CONT-40') || v.includes('40') || v.includes('CONT40') || v.includes('CONTAINER 40');
      } else if (f === 'CONTAINER 20') {
        return v.includes('CONT-20') || v.includes('20') || v.includes('CONT20') || v.includes('CONTAINER 20');
      } else if (f === 'CDD LONG CHASISS' || f === 'CDD LONG CHASSIS') {
        return v.includes('CDD LONG') || v.includes('CDD-L') || v.includes('CDD LONG CHASSIS') || v.includes('CDD LONG CHASISS') || v.includes('CDD') || v.includes('CHASSIS') || v.includes('CHASISS');
      } else if (f === 'CDE LONG') {
        return (v.includes('CDE LONG') || v.includes('CDE-L')) && !v.includes('CHASSIS') && !v.includes('CHASISS');
      } else if (f === 'CDE LONG CHASISS' || f === 'CDE LONG CHASSIS') {
        return v.includes('CDE LONG CHASSIS') || v.includes('CDE LONG CHASISS') || v.includes('CDE-L-CHASSIS');
      } else if (f === 'CDE') {
        return v.includes('CDE') && !v.includes('LONG') && !v.includes('CHASSIS') && !v.includes('CHASISS');
      } else if (f === 'MINIVAN BOX') {
        return v.includes('MINIVAN') || v.includes('MINI VAN') || v.includes('VAN');
      } else if (f === 'PIK UP' || f === 'PICK UP') {
        return v.includes('PIK UP') || v.includes('PICK UP') || v.includes('PICKUP') || v.includes('PIKUP');
      }
      return v === f;
    };

      const toggleFullScreen = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().then(() => setIsFullscreen(true)).catch(err => {
            console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
          });
        } else {
          document.exitFullscreen().then(() => setIsFullscreen(false));
        }
      };

      useEffect(() => {
        const handleFullscreenChange = () => {
          setIsFullscreen(!!document.fullscreenElement);
        };
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
      }, []);

      // Core Filters Structure
      const [filters, setFilters] = useState({
        tanggal: getTodayDateString(),
        batch: 'ALL',
        area: 'ALL',
        vehicleType: 'ALL',
        bulan: 'ALL',
        indikator: 'ALL',
        status: 'TOTAL LOAD'
      });

      const handleBulanChange = (selectedBulan) => {
        let nextTanggal = filters.tanggal;
        if (selectedBulan !== 'ALL' && filters.tanggal !== 'ALL') {
          const m = getMonthFromDate(filters.tanggal);
          if (!m || m.key !== selectedBulan) {
            nextTanggal = 'ALL';
          }
        }
        setFilters(prev => ({
          ...prev,
          bulan: selectedBulan,
          tanggal: nextTanggal
        }));
      };

      const handleTanggalChange = (selectedTanggal) => {
        let nextBulan = filters.bulan;
        if (selectedTanggal !== 'ALL') {
          const m = getMonthFromDate(selectedTanggal);
          if (m) {
            nextBulan = m.key;
          }
        }
        setFilters(prev => ({
          ...prev,
          tanggal: selectedTanggal,

        }));

          return a.monthIndex - b.monthIndex;
        });
      }, [deliveries]);
      const availableIndikators = ['ONTIME', 'OVER SLA'];

      // Step 1: Filter raw storage elements via selected inputs
      const filteredDeliveriesWithoutStatus = useMemo(() => {
        return deliveries.filter(d => {
          if (filters.tanggal !== 'ALL' && d.tanggal !== filters.tanggal) return false;

          }
          if (filters.indikator !== 'ALL' && d.indikator !== filters.indikator) return false;
          
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const idMatch = (d.id || d.noLc || '').toLowerCase().includes(q);
            const nopolMatch = (d.plateNumber || '').toLowerCase().includes(q);
            const destMatch = (d.destination || '').toLowerCase().includes(q);
            const loaderMatch = (d.loader1 || d.loader2 || d.loader3 || '').toLowerCase().includes(q);
            const picMatch = (d.picLoading || d.driverName || '').toLowerCase().includes(q);
            if (!idMatch && !nopolMatch && !destMatch && !loaderMatch && !picMatch) return false;
          }
          return true;
        });
      }, [deliveries, filters, searchQuery]);

      // Filtered deliveries excluding the batch filter strictly for the batch comparison chart
      const filteredDeliveriesExceptBatch = useMemo(() => {
        return deliveries.filter(d => {
          if (filters.tanggal !== 'ALL' && d.tanggal !== filters.tanggal) return false;
          // Skip filters.batch comparison to allow cross-batch statistics for the selected date
          if (filters.area !== 'ALL' && d.area !== filters.area) return false;
          if (!matchVehicleType(d.vehicleType, filters.vehicleType)) return false;
          if (filters.bulan && filters.bulan !== 'ALL') {
            const m = getMonthFromDate(d.tanggal);
            if (!m || m.key !== filters.bulan) return false;
          }
          if (filters.indikator !== 'ALL' && d.indikator !== filters.indikator) return false;
          
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const idMatch = (d.id || d.noLc || '').toLowerCase().includes(q);
            const nopolMatch = (d.plateNumber || '').toLowerCase().includes(q);
            const destMatch = (d.destination || '').toLowerCase().includes(q);
            const loaderMatch = (d.loader1 || d.loader2 || d.loader3 || '').toLowerCase().includes(q);
            const picMatch = (d.picLoading || d.driverName || '').toLowerCase().includes(q);
            if (!idMatch && !nopolMatch && !destMatch && !loaderMatch && !picMatch) return false;
          }
          return true;
        });
      }, [deliveries, filters.tanggal, filters.area, filters.vehicleType, filters.bulan, filters.indikator, searchQuery]);

      // Calculate state metrics (KPI Cards are calculated before status filter is applied, conforming standard SAS layout)
      const kpis = useMemo(() => {
        const total = filteredDeliveriesWithoutStatus.length;

        // Calculate unique active plates
        const activePlates = new Set(
          filteredDeliveriesWithoutStatus
            .map(d => (d.plateNumber || '').trim().toUpperCase())
            .filter(p => p !== '')
        );
        const totalArmadaAktif = activePlates.size;

        const countVehicles = (deliveries) => {
          const unique = {
            wingbox: new Set(),
            container40: new Set(),
            container20: new Set(),
            cddLongChasiss: new Set(),
            cdeLong: new Set(),
            cdeLongChasiss: new Set(),
            cde: new Set(),
            minivanBox: new Set(),
            pikUp: new Set()
          };

          deliveries.forEach(d => {
            const plate = (d.plateNumber || '').trim().toUpperCase();
            if (!plate) return;

            const type = (d.vehicleType || '').toUpperCase().trim();
            if (type.includes('WINGBOX')) {
              unique.wingbox.add(plate);
            } else if (type.includes('CONT-40') || type.includes('40') || type.includes('CONT40') || type.includes('CONTAINER 40')) {
              unique.container40.add(plate);
            } else if (type.includes('CONT-20') || type.includes('20') || type.includes('CONT20') || type.includes('CONTAINER 20')) {
              unique.container20.add(plate);
            } else if (type.includes('CDE LONG CHASSIS') || type.includes('CDE LONG CHASISS') || type.includes('CDE-L-CHASSIS')) {
              unique.cdeLongChasiss.add(plate);
            } else if (type.includes('CDE LONG') || type.includes('CDE-L')) {
              unique.cdeLong.add(plate);
            } else if (type.includes('CDE')) {
              unique.cde.add(plate);
            } else if (type.includes('CDD LONG CHASSIS') || type.includes('CDD LONG CHASISS') || type.includes('CDD LONG') || type.includes('CDD-L') || type.includes('CHASSIS') || type.includes('CHASIS') || type.includes('LONG') || type.includes('CDD')) {
              unique.cddLongChasiss.add(plate);
            } else if (type.includes('MINIVAN BOX') || type.includes('MINI VAN BOX') || type.includes('MINIVAN') || type.includes('VAN')) {
              unique.minivanBox.add(plate);
            } else if (type.includes('PIK UP') || type.includes('PICK UP') || type.includes('PICKUP') || type.includes('PIKUP')) {
              unique.pikUp.add(plate);
            }

          return {
            wingbox: unique.wingbox.size,
            container40: unique.container40.size,
            container20: unique.container20.size,
            cddLongChasiss: unique.cddLongChasiss.size,
            cdeLong: unique.cdeLong.size,
            cdeLongChasiss: unique.cdeLongChasiss.size,
            cde: unique.cde.size,
            minivanBox: unique.minivanBox.size,
            pikUp: unique.pikUp.size
          };
        };

        const selesaiDeliveries = filteredDeliveriesWithoutStatus.filter(d => d.status === 'SELESAI');
        const prosesDeliveries = filteredDeliveriesWithoutStatus.filter(d => d.status === 'PROSES');
        const antriDeliveries = filteredDeliveriesWithoutStatus.filter(d => d.status === 'ANTRI');
        const belumDatangDeliveries = filteredDeliveriesWithoutStatus.filter(d => d.status === 'BELUM DATANG');

        const selesai = selesaiDeliveries.length;
        const proses = prosesDeliveries.length;
        const antri = antriDeliveries.length;
        const belumDatang = belumDatangDeliveries.length;

        const overSla = filteredDeliveriesWithoutStatus.filter(d => d.indikator === 'OVER SLA').length;
        const ontime = filteredDeliveriesWithoutStatus.filter(d => d.indikator === 'ONTIME').length;

        return {
          TOTAL_LOAD: total,
          SELESAI: selesai,
          PROSES: proses,
          ANTRI: antri,
          BELUM_DATANG: belumDatang,
          VEHICLES: {
            SELESAI: countVehicles(selesaiDeliveries),
            PROSES: countVehicles(prosesDeliveries),
            ANTRI: countVehicles(antriDeliveries),
            BELUM_DATANG: countVehicles(belumDatangDeliveries),
          },
          TOTAL_VEHICLES: countVehicles(filteredDeliveriesWithoutStatus),
          TOTAL_ARMADA_AKTIF: totalArmadaAktif,
          OVER_SLA: overSla,
          ONTIME: ontime
        };
      }, [filteredDeliveriesWithoutStatus]);

      // Calculate dynamic CBM Realization and Achievement
      const cbmStats = useMemo(() => {
        let totalCbm = 0;
        let realizedCbm = 0;
        
        filteredDeliveriesWithoutStatus.forEach(d => {
          const val = (d.cbm === null || d.cbm === undefined) ? 0 : parseFloat(d.cbm);
          totalCbm += val;
          // "CMB Diambil pada kolom C , jika kolom close (N) sudah terisi maka tambahkan angka CMB realisainya jika kolom closes (N) belum terisi maka jangan tambahkan angka CBMnya / jangan ditotal angka CBMnya"
          const isClosed = (d.close && String(d.close).trim() !== '') || (d.checkout && String(d.checkout).trim() !== '');
          if (isClosed) {
            realizedCbm += val;
          }
        });
        
        const finalPct = totalCbm > 0 ? (realizedCbm / totalCbm) * 100 : 0;
        return {
          total: totalCbm,
          realized: realizedCbm,
          pct: finalPct
        };
      }, [filteredDeliveriesWithoutStatus]);

      // Step 2: Crop filtered entries if KPI card filter is activated and sort so PROSES is always at the topmost
      const finalFilteredDeliveries = useMemo(() => {
        const filtered = filteredDeliveriesWithoutStatus.filter(d => {
          if (filters.status && filters.status !== 'TOTAL LOAD' && filters.status !== 'ALL') {
            if (filters.status === 'OVER SLA') return d.indikator === 'OVER_SLA' || d.indikator === 'OVER SLA';
            if (filters.status === 'ONTIME') return d.indikator === 'ONTIME';
            return d.status === filters.status;
          }
          return true;
        });

        return [...filtered].sort((a, b) => {
          const statusOrder = { 'PROSES': 1, 'ANTRI': 2, 'BELUM DATANG': 3, 'SELESAI': 4 };
          const orderA = statusOrder[a.status] || 99;
          const orderB = statusOrder[b.status] || 99;
          return orderA - orderB;
        });
      }, [filteredDeliveriesWithoutStatus, filters.status]);

      // Pagination math 
      const paginatedDeliveries = useMemo(() => {
        const startIndex = (currentPage - 1) * itemsPerPage;
        return finalFilteredDeliveries.slice(startIndex, startIndex + itemsPerPage);
      }, [finalFilteredDeliveries, currentPage]);

      const totalPages = useMemo(() => {
        return Math.ceil(finalFilteredDeliveries.length / itemsPerPage) || 1;
      }, [finalFilteredDeliveries]);

      // KPI Interactive Trigger Helper
      const setStatusFilter = (targetStatus) => {
        setFilters(prev => ({ ...prev, status: targetStatus }));
        setCurrentPage(1);
      };

      // Chart 1: Status Counts Bar Data
      const barChartValues = useMemo(() => {
        const categories = [
          { name: 'SELESAI', key: 'SELESAI', val: kpis.SELESAI, bg: 'bg-[#064e3b]', iconColor: 'text-[#064e3b]' },
          { name: 'PROSES', key: 'PROSES', val: kpis.PROSES, bg: 'bg-[#facc15]', iconColor: 'text-[#facc15]' },
          { name: 'ANTRI', key: 'ANTRI', val: kpis.ANTRI, bg: 'bg-[#f97316]', iconColor: 'text-[#f97316]' },
          { name: 'BELUM DATANG', key: 'BELUM_DATANG', val: kpis.BELUM_DATANG, bg: 'bg-[#ef4444]', iconColor: 'text-[#ef4444]' }
        ];
        const maxVal = Math.max(...categories.map(c => c.val), 1);
        return categories.map(c => ({
          ...c,
          percent: (c.val / maxVal) * 100,
          vehicles: kpis.VEHICLES[c.key]
        }));
      }, [kpis]);

      // Chart 2: Status Percentage Donut Data
      const totalKpiVolume = kpis.TOTAL_LOAD || 1;
      const statusDonutSegments = useMemo(() => {
        const segments = [
          { name: 'SELESAI', val: kpis.SELESAI, color: '#064e3b' },
          { name: 'PROSES', val: kpis.PROSES, color: '#facc15' },
          { name: 'ANTRI', val: kpis.ANTRI, color: '#f97316' },

        let cumulative = 0;
        return segments.map(seg => {
          const fraction = seg.val / totalKpiVolume;
          const strokeDasharray = "125.6";
          const strokeDashoffset = 125.6 * (1 - fraction);
          const rotation = -90 + (cumulative * 360);
          cumulative += fraction;
          return {
            ...seg,
            strokeDasharray,
            strokeDashoffset,
            rotation,
            percent: fraction * 100
          };
        });
      }, [kpis, totalKpiVolume]);

      // Chart 3: Weekly CBM Achievement Line Graph - Show multi-day progression
      const trendChartPaths = useMemo(() => {
        // Filter deliveries ignoring ONLY the specific selected date parameter (filters.tanggal)
        // so that the line chart shows a beautiful history even when looking at a single day's KPI
        const deliveriesForTrend = deliveries.filter(d => {
          if (filters.batch !== 'ALL' && d.batch !== filters.batch) return false;
          if (filters.area !== 'ALL' && d.area !== filters.area) return false;
          if (filters.vehicleType !== 'ALL' && d.vehicleType !== filters.vehicleType) return false;
          if (filters.bulan && filters.bulan !== 'ALL') {
            const m = getMonthFromDate(d.tanggal);
            if (!m || m.key !== filters.bulan) return false;
          }
          if (filters.indikator !== 'ALL' && d.indikator !== filters.indikator) return false;
          
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const idMatch = (d.id || d.noLc || '').toLowerCase().includes(q);
            const nopolMatch = (d.plateNumber || '').toLowerCase().includes(q);
            const destMatch = (d.destination || '').toLowerCase().includes(q);
            const loaderMatch = (d.loader1 || d.loader2 || d.loader3 || '').toLowerCase().includes(q);
            const picMatch = (d.picLoading || d.driverName || '').toLowerCase().includes(q);
            if (!idMatch && !nopolMatch && !destMatch && !loaderMatch && !picMatch) return false;
          }
          return true;
        });

        // Group by Date and sum CBM values
        const dateGroups = deliveriesForTrend.reduce((acc, curr) => {
          if (curr.tanggal) {
            // "pencapaian CMB ambil datanya di kolom C Jika kolom close(N) sudah terisi"
            const isClosed = (curr.close && String(curr.close).trim() !== '') || (curr.checkout && String(curr.checkout).trim() !== '');
            if (isClosed) {
              const val = parseFloat(curr.cbm) || 0;
              acc[curr.tanggal] = (acc[curr.tanggal] || 0) + val;
            } else {
              if (acc[curr.tanggal] === undefined) {
                acc[curr.tanggal] = 0;
              }
            }
          }
          return acc;
        }, {});
        
        let list = Object.entries(dateGroups).map(([date, total]) => ({ date, total: parseFloat(total.toFixed(2)) }));
        const allZero = list.length > 0 && list.every(item => item.total === 0);
        if (list.length === 0 || allZero) {
          list = [
            { date: '21/05/2026', total: 75.0 },
            { date: '22/05/2026', total: 112.5 },
            { date: '23/05/2026', total: 153.0 },
            { date: '24/05/2026', total: 125.5 },
            { date: '25/05/2026', total: 187.0 },
            { date: '26/05/2026', total: 228.0 },
            { date: '27/05/2026', total: 275.5 }
          ];
        } else {
          list.sort((a,b) => {
            const parseDate = (str) => {
              const parts = str.split('/');
              if (parts.length === 3) {
                return new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
              }
              return new Date(str);
            };
            return parseDate(a.date) - parseDate(b.date);
          });
        }

        // Limit to last 7 entries for 7 days trend duration as requested
        list = list.slice(-7);

        const maxTotal = Math.max(...list.map(l => l.total), 10);
        const w = 1200; // viewBox width for full-row display
        const h = 400;  // viewBox height
        const paddingLeft = 80;    
        const paddingRight = 40;   
        const paddingTop = 60;    
        const paddingBottom = 60; 
        
        const chartWidth = w - paddingLeft - paddingRight;
        const chartHeight = h - paddingTop - paddingBottom;
        
        // Calculate points for line chart
        const points = list.map((item, idx) => {
          const x = paddingLeft + (idx * (chartWidth / (list.length - 1 || 1)));
          const pctOfMax = item.total / (maxTotal * 1.15 || 1); // 1.15 factor ensures points never touch absolute top edge
          const y = paddingTop + chartHeight - (pctOfMax * chartHeight);
          return { x, y, val: item.total, date: item.date };
        });

        // Calculate bars for bar chart
        const barGapRatio = 0.4;
        const availableWidthForBars = chartWidth;
        const barGroupWidth = availableWidthForBars / list.length;
        const barWidth = barGroupWidth * (1 - barGapRatio);
        const barGap = barGroupWidth * barGapRatio;
        
        const bars = list.map((item, idx) => {
          const x = paddingLeft + (idx * barGroupWidth) + (barGap / 2);
          const pctOfMax = item.total / (maxTotal * 1.1 || 1);
          const barHeight = pctOfMax * chartHeight;
          const y = paddingTop + chartHeight - barHeight;
          return { x, y, width: barWidth, height: barHeight, val: item.total, date: item.date };
        });

        // Function to create smooth cubic bezier path
        const getSmoothPath = (pts) => {
          if (pts.length < 2) return "";
          let path = `M ${pts[0].x} ${pts[0].y}`;
          for (let i = 0; i < pts.length - 1; i++) {
            const p0 = pts[i];
            const p1 = pts[i+1];
            const cp1x = p0.x + (p1.x - p0.x) / 2;
            const cp1y = p0.y;
            const cp2x = p0.x + (p1.x - p0.x) / 2;
            const cp2y = p1.y;
            path += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p1.x} ${p1.y}`;
          }
          return path;
        };

        const path = getSmoothPath(points);
        const areaPath = points.length > 0 ? `${path} L ${points[points.length-1].x} ${paddingTop + chartHeight} L ${points[0].x} ${paddingTop + chartHeight} Z` : "";

        return { points, path, areaPath, list, maxTotal, paddingLeft, paddingRight, paddingTop, paddingBottom, chartWidth, chartHeight, h, w, bars, barWidth };
      }, [deliveries, filters.batch, filters.area, filters.vehicleType, filters.bulan, filters.indikator, searchQuery]);

      // Chart 4: Batch Loading Performance Area (using filteredDeliveriesExceptBatch to compare across batches)
      const batchStats = useMemo(() => {
        return filteredDeliveriesExceptBatch.reduce((acc, curr) => {
          if (curr.batch) {
            if (!acc[curr.batch]) {
              acc[curr.batch] = { total: 0, selesai: 0, proses: 0, antri: 0, belumDatang: 0 };
            }
            acc[curr.batch].total += 1;
            if (curr.status === 'SELESAI') acc[curr.batch].selesai += 1;
            else if (curr.status === 'PROSES') acc[curr.batch].proses += 1;
            else if (curr.status === 'ANTRI') acc[curr.batch].antri += 1;
            else if (curr.status === 'BELUM DATANG') acc[curr.batch].belumDatang += 1;
          }
          return acc;
        }, {});
      }, [filteredDeliveriesExceptBatch]);

      // Chart 5: SLA Gauge calculation
      const onTimePercentage = useMemo(() => {
        if (!kpis.TOTAL_LOAD) return 100;
        return (kpis.ONTIME / kpis.TOTAL_LOAD) * 100;
      }, [kpis]);

      const overTimePercentage = useMemo(() => {
        if (!kpis.TOTAL_LOAD) return 0;
        return (kpis.OVER_SLA / kpis.TOTAL_LOAD) * 100;
      }, [kpis]);

      // Analytical KPIs for Card 4B (Operational Efficiency / Metrics Box)
      const avgLoadTime = useMemo(() => {
        const completed = filteredDeliveriesWithoutStatus.filter(d => d.status === 'SELESAI');
        if (completed.length === 0) return 0;
        const sum = completed.reduce((acc, curr) => acc + (Number(curr.realisasi) || 0), 0);
        return Math.round(sum / completed.length);
      }, [filteredDeliveriesWithoutStatus]);

      const activeGateStats = useMemo(() => {
        const counts = {};
        filteredDeliveriesWithoutStatus.forEach(d => {
          if (d.pintu) {
            const cleanPintu = String(d.pintu).trim().toUpperCase();
            if (cleanPintu && cleanPintu !== '-') {
              counts[cleanPintu] = (counts[cleanPintu] || 0) + 1;
            }
          }
        });
        let maxGate = '-';
        let maxVal = 0;
        Object.entries(counts).forEach(([gate, count]) => {
          if (count > maxVal) {
            maxVal = count;
            maxGate = gate;
          }
        });
        return { gate: maxGate, count: maxVal };
      }, [filteredDeliveriesWithoutStatus]);

      const gateUtilization = useMemo(() => {
        const totalGatesCount = 13; // We have 13 pintu gates under PintuView
        const activeGatesCount = new Set(
          filteredDeliveriesWithoutStatus
            .filter(d => d.status === 'PROSES' && d.pintu)
            .map(d => String(d.pintu).trim().toUpperCase())
        ).size;
        return Math.round((activeGatesCount / totalGatesCount) * 100);
      }, [filteredDeliveriesWithoutStatus]);

      // Pie Chart slice calculations for lead time loading (Standard Flat Pie Chart)
      const getPieSlicePath = useCallback((cx, cy, r, startAngle, endAngle) => {
        if (endAngle - startAngle >= 359.9) {
          return `
            M ${cx} ${cy - r}
            A ${r} ${r} 0 1 1 ${cx - 0.01} ${cy - r}
            Z
          `;
        }
        const startRad = (startAngle - 90) * Math.PI / 180;
        const endRad = (endAngle - 90) * Math.PI / 180;
        
        const x1 = cx + r * Math.cos(startRad);
        const y1 = cy + r * Math.sin(startRad);
        const x2 = cx + r * Math.cos(endRad);
        const y2 = cy + r * Math.sin(endRad);
        
        const largeArcFlag = (endAngle - startAngle) > 180 ? 1 : 0;
        
        return `
          M ${cx} ${cy}
          L ${x1} ${y1}
          A ${r} ${r} 0 ${largeArcFlag} 1 ${x2} ${y2}
          Z
        `;
      }, []);

      const getPieLabelCoords = useCallback((cx, cy, r, startAngle, endAngle) => {
        const midAngle = startAngle + (endAngle - startAngle) / 2;
        const labelRadius = r * 0.58; // Center the text beautifully inside the slice
        const rad = (midAngle - 90) * Math.PI / 180;
        return {
          x: cx + labelRadius * Math.cos(rad),
          y: cy + labelRadius * Math.sin(rad)
        };
      }, []);

      const pieSlices = useMemo(() => {
        const rawData = [
          { name: 'ON TIME', val: kpis.ONTIME, colorBg: theme === 'dark' ? 'bg-[#34d399]' : 'bg-[#3bb175]', colorHex: theme === 'dark' ? '#34d399' : '#3bb175', radius: 82, textHex: '#ffffff' },
          { name: 'OVER SLA', val: kpis.OVER_SLA, colorBg: theme === 'dark' ? 'bg-[#f87171]' : 'bg-[#e0535e]', colorHex: theme === 'dark' ? '#f87171' : '#e0535e', radius: 82, textHex: '#ffffff' }
        ];

        const totalSum = rawData.reduce((acc, curr) => acc + curr.val, 0);
        const isPlaceholder = totalSum === 0;

        // If placeholder, use equal weights, otherwise show all active
        const activeItems = isPlaceholder 
          ? rawData.map(d => ({ ...d, val: 1 }))
          : rawData.filter(d => d.val > 0);

        const activeSum = activeItems.reduce((acc, curr) => acc + curr.val, 0);

        let accumAngle = 0;
        const slices = activeItems.map(item => {
          const share = activeSum > 0 ? (item.val / activeSum) : (1 / activeItems.length);
          const angleSize = share * 360;
          
          const startAngle = accumAngle;
          const endAngle = accumAngle + angleSize;
          accumAngle = endAngle;

          return {
            ...item,
            share,
            percentage: share * 100,
            startAngle,
            endAngle: Math.min(endAngle, 359.99), // Prevent 360 circle overlap issue
            isPlaceholder
          };
        });

        return { slices, isPlaceholder };
      }, [kpis, theme]);


      if (initialLoading) {
        const phases = [
          "🛡️ Menginisialisasi LOGISTICS CONTROL CENTER...",
          "📡 Menghubungkan ke Google Sheets Database Hub...",
          "🚚 Menyelaraskan Penjadwalan Gate & Antrean Armada...",

        ];

        const truckSequence = [
          { type: 'wingbox', label: 'WINGBOX' },
          { type: 'container 40', label: 'CONTAINER 40' },
          { type: 'container 20', label: 'CONTAINER 20' },
          { type: 'cdd long chasiss', label: 'CDD LONG CHASSIS' },
          { type: 'cdd long', label: 'CDD LONG' },
          { type: 'cde long chasiss', label: 'CDE LONG CHASSIS' },
          { type: 'cdd', label: 'CDD' },
          { type: 'minivan box', label: 'MINIVAN BOX' },
          { type: 'pikup', label: 'PICK UP' }
        ];

        const truckIndex = Math.floor((loadingProgress / 100) * truckSequence.length);
        const currentTruck = truckSequence[Math.min(truckIndex, truckSequence.length - 1)];

        return (
          <div
