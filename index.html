                        <th className="py-3 px-3 border-b border-slate-950" title="Y: Driver PIC Loading">PIC Loading</th>
                        <th className="py-3 px-2 text-center border-b border-slate-950" title="Z: Produktivitas Pemuatan">Produktivitas</th>
                        <th className="py-3 px-2 text-center border-b border-slate-950">Status Operasi</th>
                        <th className="py-3 px-2 text-center border-b border-slate-950 w-16">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="text-[11.5px] font-semibold text-slate-700 dark:text-slate-300 font-medium">
                      
                      {paginatedDeliveries.map((item, index) => {
                        const serialNum = (currentPage - 1) * itemsPerPage + index + 1;

                        // Apply conditional format matching rules 
                        let bgClass = "hover:bg-slate-50 dark:hover:bg-slate-800/45";
                        let borderLeftClass = "border-l-4 border-slate-300 dark:border-slate-700";

                        if (item.status === 'SELESAI') {
                          bgClass = "bg-emerald-500/5 dark:bg-emerald-500/2 hover:bg-emerald-500/10 transition";
                          borderLeftClass = "border-l-4 border-[#064e3b]";
                        } else if (item.status === 'PROSES') {
                          bgClass = "bg-yellow-400/5 dark:bg-yellow-400/10 hover:bg-yellow-400/10 transition";
                          borderLeftClass = "border-l-4 border-[#facc15]";
                        } else if (item.status === 'ANTRI') {
                          bgClass = "bg-orange-500/5 dark:bg-orange-500/2 hover:bg-orange-500/10 transition";
                          borderLeftClass = "border-l-4 border-[#f97316]";
                        } else {
                          bgClass = "bg-red-100/40 dark:bg-red-950/20 hover:bg-red-100/70 dark:hover:bg-red-800 transition";
                          borderLeftClass = "border-l-4 border-[#ef4444]";
                        }

                        // Override color alert row if OVER SLA occurs
                        if (item.indikator === 'OVER SLA') {
                          bgClass = "bg-rose-500/5 dark:bg-rose-950/15 hover:bg-rose-500/10 dark:hover:bg-rose-950/20 transition";
                          borderLeftClass = "border-l-4 border-rose-600";
                        }

                        return (
                          <tr key={item.id} className={`border-b border-slate-100 dark:border-slate-800/60 font-semibold text-[11px] ${bgClass}`}>
                            {/* Serial */}
                            <td className={`py-3 px-2 text-center text-slate-400 dark:text-slate-500 font-mono ${borderLeftClass}`}>{serialNum}</td>
                            
                            {/* A. Tanggal */}
                            <td className="py-3 px-2 text-slate-500 dark:text-slate-400 font-medium whitespace-nowrap">{item.tanggal || '-'}</td>

                            {/* B. LC code */}
                            <td className="py-3 px-2 font-mono font-bold text-slate-800 dark:text-slate-100">{item.id || item.noLc}</td>
                            
                            {/* C. CBM */}
                            <td className="py-3 px-2 text-center font-mono font-bold text-slate-600 dark:text-slate-400">{item.cbm !== undefined && item.cbm !== null ? item.cbm : '-'}</td>

                            {/* D. PC */}
                            <td className="py-3 px-2 text-center font-mono">
                              <span className={Number(item.pc) === 100 || String(item.pc).trim() === "100" || String(item.pc).trim() === "100%" ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 px-1.5 py-0.5 rounded font-extrabold" : "text-slate-600 dark:text-slate-400"}>
                                {item.pc !== undefined && item.pc !== null ? `${item.pc}%` : '-'}
                              </span>
                            </td>

                            {/* E. STG */}
                            <td className="py-3 px-2 text-center font-mono">
                              <span className={Number(item.stg) === 100 || String(item.stg).trim() === "100" || String(item.stg).trim() === "100%" ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 px-1.5 py-0.5 rounded font-extrabold" : "text-slate-600 dark:text-slate-400"}>
                                {item.stg !== undefined && item.stg !== null ? `${item.stg}%` : '-'}
                              </span>
                            </td>

                            {/* F. LD */}
                            <td className="py-3 px-2 text-center font-mono">
                              <span className={Number(item.ld) === 100 || String(item.ld).trim() === "100" || String(item.ld).trim() === "100%" ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 px-1.5 py-0.5 rounded font-extrabold" : "text-slate-600 dark:text-slate-400"}>
                                {item.ld !== undefined && item.ld !== null ? `${item.ld}%` : '-'}
                              </span>
                            </td>

                            {/* G. Dest */}
                            <td className="py-3 px-3 max-w-[130px] truncate font-medium text-slate-500 dark:text-slate-400" title={item.destination}>{item.destination}</td>
                            
                            {/* H. Transport */}
                            <td className="py-3 px-3 font-semibold text-slate-600 dark:text-slate-400">{item.vehicleType}</td>
                            
                            {/* I. Area */}
                            <td className="py-3 px-3 font-bold text-[10px] text-slate-500 dark:text-slate-400">{item.area}</td>

                            {/* J. Plate */}
                            <td className="py-3 px-2 font-mono font-bold text-slate-700 dark:text-slate-300">{item.plateNumber || '-'}</td>
                            
                            {/* K. Checkin */}
                            <td className="py-3 px-2 font-mono text-[10px] text-slate-600 dark:text-slate-400">{formatTimeValue(item.checkin)}</td>

                            {/* L. Physical */}
                            <td className="py-3 px-2 font-mono text-[10px] text-slate-600 dark:text-slate-400">{formatTimeValue(item.physical)}</td>

                            {/* M. Open */}
                            <td className="py-3 px-2 font-mono text-[10px] text-slate-600 dark:text-slate-400">{formatTimeValue(item.open)}</td>

                            {/* N. Close */}
                            <td className="py-3 px-2 font-mono text-[10px] text-slate-600 dark:text-slate-400">{formatTimeValue(item.close)}</td>

                            {/* O. Checkout */}
                            <td className="py-3 px-2 font-mono text-[10px] text-slate-600 dark:text-slate-400">{formatTimeValue(item.checkout)}</td>
                            
                            {/* P. Target allotted mins */}
                            <td className="py-3 px-2 text-center font-mono text-slate-500 dark:text-slate-500">{item.target} m</td>

                            {/* Q. Remaining dynamic minutes - warning style if negative */}
                            <LiveBerjalanCell item={item} />
                            
                            {/* R. Realisasi actual elapsed */}
                            <td className="py-3 px-2 text-center font-mono font-bold text-slate-500 dark:text-slate-500">
                              {item.realisasi ? `${item.realisasi} m` : '-'}
                            </td>
                            
                            {/* S. Indicator flag button background text color formatting */}
                            <td className="py-3 px-2 font-bold">
                              <span className={`text-[9px] px-2 py-0.5 rounded-full border leading-none tracking-widest ${
                                item.indikator === 'ONTIME' 
                                  ? 'bg-emerald-500/10 text-emerald-600 border-emerald-500/20 dark:text-emerald-400 dark:bg-emerald-500/5' 
                                  : 'bg-rose-500/10 text-rose-600 border-rose-500/20 dark:text-rose-400 dark:bg-rose-500/5 animate-pulse'
                              }`}>
                                {item.indikator}
                              </span>
                            </td>

                            {/* T. Batch */}
                            <td className="py-3 px-2 font-bold text-slate-500 dark:text-slate-400">{item.batch || '-'}</td>

                            {/* U. Pintu */}
                            <td className="py-3 px-2 text-center font-bold text-slate-700 dark:text-slate-300">{item.pintu || 'PINTU 1'}</td>

                            {/* V-X. Personnel lists */}
                            <td className="py-3 px-2 font-mono text-[10px] text-slate-500 dark:text-slate-400 truncate max-w-[120px]" title={`${item.loader1 || '-'} / ${item.loader2 || '-'} / ${item.loader3 || '-'}`}>
                              {item.loader1 || item.loader2 || item.loader3 ? `${item.loader1 || '-'}/${item.loader2 || '-'}/${item.loader3 || '-'}` : '-'}
                            </td>

                            {/* Y. Driver / PIC name */}
                            <td className="py-3 px-3 truncate font-semibold text-slate-600 dark:text-slate-400">{item.picLoading || item.driverName || 'Asep Logistics'}</td>

                            {/* Z. Produktivitas Loading */}
                            <td className="py-3 px-3 text-center font-mono font-bold text-emerald-600 dark:text-emerald-400">
                              {item.produktivitas !== undefined && item.produktivitas !== null ? `${item.produktivitas}` : '-'}
                            </td>

                            {/* Dynamic state selector */}
                            <td className="py-3 px-2 text-center">
                              <select
                                value={item.status}
                                onChange={(e) => handleStatusChange(item.id || item.noLc, e.target.value)}
                                className={`text-[10px] font-extrabold px-2 py-1 rounded-xl outline-none border cursor-pointer select-none transition min-w-[95px] h-7 text-center leading-none appearance-none ${
                                  item.status === 'SELESAI' ? 'bg-[#064e3b] border-emerald-700 text-white' :
                                  item.status === 'PROSES' ? 'bg-[#facc15] border-yellow-400 text-slate-950' :
                                  item.status === 'ANTRI' ? 'bg-[#f97316] border-orange-600 text-white' :
                                  'bg-[#ef4444] border-red-600 text-white'
                                }`}
                              >
                                <option value="BELUM DATANG">BELUM DATANG</option>
                                <option value="ANTRI">ANTRI</option>
                                <option value="PROSES">PROSES</option>
                                <option value="SELESAI">SELESAI</option>
                              </select>
                            </td>

                            {/* Actions block delete */}
                            <td className="py-3 px-2 text-center">
                              <button
                                onClick={() => handleDeleteDelivery(item.id || item.noLc)}
                                className="p-1 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/30 text-rose-500 active:scale-90 transition inline-flex items-center justify-center border border-transparent hover:border-rose-100"
                                title="Hapus Manifest"
                              >
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5" className="w-3.5 h-3.5">
                                  <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                              </button>
                            </td>
                          </tr>
                        );
                      })}

                    </tbody>
                  </table>

                  {finalFilteredDeliveries.length === 0 && (
                    <div className="py-16 text-center text-slate-400 dark:text-slate-500 select-none flex flex-col items-center justify-center gap-2">
                      <span className="text-3xl">📭</span>
                      <p className="text-xs font-bold uppercase tracking-wider">Data loading outbound tidak ditemukan</p>
                      <p className="text-[10px] opacity-75">Sesuaikan filter atau registrasikan armada baru di atas</p>
                    </div>
                  )}

                </div>

                {/* Table Footer Navigation metadata pagination */}
                <div className="p-4 border-t border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs font-bold text-slate-400 dark:text-slate-500 select-none">
                  <div>
                    Menampilkan <span className="text-slate-600 dark:text-slate-300 font-mono">{Math.min(finalFilteredDeliveries.length, (currentPage - 1) * itemsPerPage + 1)}-{Math.min(finalFilteredDeliveries.length, currentPage * itemsPerPage)}</span> dari <span className="text-slate-600 dark:text-slate-300 font-mono">{finalFilteredDeliveries.length}</span> manifests loading
                  </div>

                  {totalPages > 1 && (
                    <div className="flex items-center gap-1">
                      <button onClick={() => setCurrentPage(prev => Math.max(1, prev - 1))} disabled={currentPage === 1} className="px-3 py-1.5 border border-slate-200 dark:border-slate-800 rounded-lg hover:bg-white dark:hover:bg-slate-900 disabled:opacity-50 disabled:cursor-not-allowed transition font-extrabold">&lt; Sebelum</button>
                      
                      {Array.from({ length: totalPages }, (_, i) => i + 1).map(pageNum => (
                        <button key={pageNum} onClick={() => setCurrentPage(pageNum)} className={`w-8 h-8 rounded-lg border font-mono font-bold transition flex items-center justify-center ${currentPage === pageNum ? 'bg-zinc-650 border-zinc-650 text-white shadow-md' : 'border-slate-200 dark:border-slate-800 hover:bg-white dark:hover:bg-slate-900 text-slate-600 dark:text-slate-400'}`}>
                          {pageNum}
                        </button>
                      ))}

                      <button onClick={() => setCurrentPage(prev => Math.min(totalPages, prev + 1))} disabled={currentPage === totalPages} className="px-3 py-1.5 border border-slate-200 dark:border-slate-800 rounded-lg hover:bg-white dark:hover:bg-slate-900 disabled:opacity-50 disabled:cursor-not-allowed transition font-extrabold font-sans">Berikutnya &gt;</button>
                    </div>
                  )}
                </div>

              </section>

            </React.Fragment>
          )}

              {activeTab === 'pintu' && (
                <PintuView deliveries={deliveries} setDeliveries={setDeliveries} theme={theme} showToast={showToast} filters={filters} />
              )}

              {activeTab === 'mpp' && (
                <RekapProductivityView 
                  data={rekapProductivity} 
                  theme={theme} 
                />
              )}

              {activeTab === 'analytics' && (
                <AnalyticsView deliveries={deliveries} theme={theme} />
              )}

              {activeTab === 'penyimpangan' && (
                <PenyimpanganPickingView theme={theme} showToast={showToast} />
              )}

            </main>

            {/* ====== APP SYSTEM TOAST ALERTS NOTIFIER ====== */}
            {toast && (
              <div className={`fixed bottom-6 right-6 z-50 px-5 py-4 rounded-2xl shadow-xl flex items-center gap-3 border transition-all text-white max-w-sm ${
                toast.type === 'success' ? 'bg-emerald-950/95 border-emerald-800' :
                toast.type === 'error' ? 'bg-rose-950/95 border-rose-800' : 'bg-slate-900/95 border-slate-800'
              }`}>
                <div className={`w-2 h-2 rounded-full animate-bounce ${toast.type === 'success' ? 'bg-emerald-400' : 'bg-rose-400'}`} />
                <span className="text-xs font-bold leading-tight tracking-wide">{toast.message}</span>
              </div>
            )}

            {/* ====== FOOTER LOGISTIC SIGN OFF CREDITS ====== */}
            <footer className="py-5 text-center text-[10px] text-slate-400 font-bold uppercase tracking-widest border-t border-slate-100 dark:border-slate-950 select-none mt-auto pb-5">
              Kawan Lama Group Logistics &copy; 2026. All rights Reserved.
            </footer>

          </div>

          <AddLoadModal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} onAdd={handleAddDelivery} />
        </React.Fragment>
      );
    }

    // ==========================================
    // ROBUST SYSTEM ERROR BOUNDARY
    // ==========================================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, info) {
        console.error("Dashboard error trapped in Boundary: ", error, info);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 bg-slate-950 text-red-400 min-h-screen font-mono text-xs flex flex-col justify-center items-center gap-4">
              <h1 className="text-sm font-black uppercase text-red-500 tracking-widest">Dashboard crash caught in boundary</h1>
              <p className="opacity-80">Message: {this.state.error ? this.state.error.toString() : "Unknown exception"}</p>
              <button onClick={() => window.location.reload()} className="px-4 py-2 bg-red-650 hover:bg-red-700 text-white rounded-lg uppercase tracking-wider font-extrabold shadow-lg">Refresh Panel</button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ==========================================
    // SYSTEM MOUNTING & INITIALIZATION
    // ==========================================
    try {
      const rootElement = document.getElementById('root');
      if (!rootElement) {
        throw new Error("Gagal menemukan elemen 'root' di dalam DOM. Pastikan Index.html tidak rusak.");
      }
      
      const root = ReactDOM.createRoot(rootElement);
      root.render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>
      );
      console.log("LOGISTICS CONTROL CENTER: React Mounting Success");
    } catch (mountError) {
      console.error("FATAL REACT MOUNTING ERROR:", mountError);
      var diag = document.getElementById('sandboxed-error-hud');
      if (!diag) {
        alert("CRITICAL UI ERROR: Gagal memuat aplikasi. Periksa koneksi atau browser Anda.\n\nDetail: " + mountError.message);
      }
    }
  </script>
</body>
</html>
