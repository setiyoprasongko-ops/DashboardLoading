<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONITORING LOADING OUTBOUND - LOGISTICS CONTROL CENTER</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone (untuk JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Recharts -->
  <script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root">
    <div class="flex items-center justify-center min-h-screen">
      <div class="animate-spin w-10 h-10 border-4 border-rose-200 border-t-rose-600 rounded-full"></div>
    </div>
  </div>

  <!-- APLIKASI REACT UTAMA -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;
    const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell } = window.Recharts;

    // ==========================================
    // KONFIGURASI GOOGLE APPS SCRIPT
    // ==========================================
    // ⚠️ GANTI URL INI DENGAN URL WEB APP DEPLOYMENT DARI GOOGLE APPS SCRIPT ANDA
    const API_URL = "https://script.google.com/macros/s/AKfyc.../exec"; 

    // Simulasi Data untuk Preview
    const mockDeliveries = [
      { id: "LC001", plateNumber: "B 1234 CD", destination: "JAKARTA", status: "PROSES", open: "08:00", close: "-", berjalan: 45, pintu: "PINTU 1" },
      { id: "LC002", plateNumber: "D 5678 EF", destination: "BANDUNG", status: "ANTRI", open: "-", close: "-", berjalan: 0, pintu: "" },
      { id: "LC003", plateNumber: "B 9012 GH", destination: "TANGERANG", status: "SELESAI", open: "07:00", close: "08:30", berjalan: 90, pintu: "PINTU 2" },
      { id: "LC004", plateNumber: "F 3456 IJ", destination: "BOGOR", status: "BELUM DATANG", open: "-", close: "-", berjalan: 0, pintu: "" }
    ];

    async function fetchGAS(action, payload = {}) {
      if (!API_URL || API_URL.includes("AKfyc...")) {
        console.warn("API_URL belum disetel. Menggunakan simulasi data.");
        if (action === 'getDeliveries') return mockDeliveries;
        return { success: true };
      }
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          mode: 'cors',
          body: JSON.stringify({ action, data: payload })
        });
        const result = await res.json();
        if (!result.success) throw new Error(result.error);
        return result.data;
      } catch (err) {
        console.error("Fetch GAS Error:", err);
        throw err; // Akan ditangkap oleh try-catch di komponen
      }
    }

    // ==========================================
    // SVG ICONS
    // ==========================================
    const LogoIcon = ({ className = "w-6 h-6" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
        <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
        <line x1="12" y1="22.08" x2="12" y2="12" />
      </svg>
    );

    const RefreshIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
      </svg>
    );

    const ChartBarIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="18" y1="20" x2="18" y2="10" />
        <line x1="12" y1="20" x2="12" y2="4" />
        <line x1="6" y1="20" x2="6" y2="14" />
      </svg>
    );

    const SearchIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
    );

    // ==========================================
    // KOMPONEN DASHBOARD UTAMA
    // ==========================================
    const App = () => {
      const [deliveries, setDeliveries] = useState([]);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchQuery, setSearchQuery] = useState('');
      const [isLoading, setIsLoading] = useState(true);

      const loadData = useCallback(async () => {
        setIsLoading(true);
        try {
          const data = await fetchGAS('getDeliveries');
          setDeliveries(data);
        } catch (err) {
          console.error("Gagal memuat data", err);
          // Fallback ke mock data jika error koneksi
          setDeliveries(mockDeliveries);
        } finally {
          setIsLoading(false);
        }
      }, []);

      useEffect(() => { loadData(); }, [loadData]);

      const filteredDeliveries = useMemo(() => {
        return deliveries.filter(d => {
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            return (d.id || '').toLowerCase().includes(q) || (d.plateNumber || '').toLowerCase().includes(q);
          }
          return true;
        });
      }, [deliveries, searchQuery]);

      const kpis = {
        TOTAL_LOAD: deliveries.length,
        SELESAI: deliveries.filter(d => d.status === 'SELESAI').length,
        PROSES: deliveries.filter(d => d.status === 'PROSES').length,
        ANTRE: deliveries.filter(d => d.status === 'ANTRI' || d.status === 'ANTRE').length,
        BELUM: deliveries.filter(d => d.status === 'BELUM DATANG').length,
      };

      // Chart Data
      const statusData = [
        { name: 'Selesai', value: kpis.SELESAI, color: '#10b981' },
        { name: 'Proses', value: kpis.PROSES, color: '#facc15' },
        { name: 'Antre', value: kpis.ANTRE, color: '#f97316' },
        { name: 'Belum Datang', value: kpis.BELUM, color: '#ef4444' },
      ].filter(d => d.value > 0);

      const pintuDataMap = deliveries.reduce((acc, d) => {
        if (!d.pintu) return acc;
        if (!acc[d.pintu]) acc[d.pintu] = { name: d.pintu, total: 0, selesai: 0 };
        acc[d.pintu].total += 1;
        if (d.status === 'SELESAI') acc[d.pintu].selesai += 1;
        return acc;
      }, {});
      const pintuData = Object.values(pintuDataMap).sort((a, b) => a.name.localeCompare(b.name));

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="px-6 py-4 flex items-center justify-between bg-slate-900 text-white shadow-xl">
            <div className="flex items-center gap-4">
              <LogoIcon className="text-rose-500 w-8 h-8" />
              <div>
                <h1 className="text-sm font-black uppercase tracking-widest">MONITORING LOADING OUTBOUND</h1>
                <p className="text-[10px] text-slate-400 font-bold tracking-wider">Kawan Lama Group Logistics Hub</p>
              </div>
            </div>
            <button 
              onClick={loadData} 
              className={`p-2.5 bg-white/10 rounded-xl hover:bg-white/20 transition-all ${isLoading ? 'animate-spin' : ''}`}
              title="Refresh Data"
            >
              <RefreshIcon className="w-4 h-4" />
            </button>
          </header>

          <main className="flex-1 p-6 space-y-6 max-w-7xl mx-auto w-full">
            {/* Tabs */}
            <div className="flex gap-2">
              {['dashboard', 'analytics'].map(tab => (
                <button 
                  key={tab}
                  onClick={() => setActiveTab(tab)}
                  className={`px-6 py-2.5 rounded-2xl text-xs font-black uppercase tracking-widest transition-all ${
                    activeTab === tab ? 'bg-rose-600 text-white shadow-lg shadow-rose-600/30' : 'bg-white border border-slate-200 text-slate-500 hover:bg-slate-50'
                  }`}
                >
                  {tab}
                </button>
              ))}
            </div>

            {activeTab === 'dashboard' && (
              <div className="space-y-6 animate-in fade-in duration-500">
                {/* KPI Grid */}
                <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                   {[
                     { label: 'TOTAL LOAD', val: kpis.TOTAL_LOAD, color: 'bg-slate-900' },
                     { label: 'SELESAI', val: kpis.SELESAI, color: 'bg-emerald-600' },
                     { label: 'PROSES', val: kpis.PROSES, color: 'bg-amber-500' },
                     { label: 'ANTRE', val: kpis.ANTRE, color: 'bg-orange-500' },
                     { label: 'BELUM DATANG', val: kpis.BELUM, color: 'bg-rose-600' }
                   ].map(kpi => (
                     <div key={kpi.label} className={`${kpi.color} p-5 rounded-3xl text-white shadow-xl hover:scale-[1.02] transition-transform`}>
                        <div className="text-[10px] font-black opacity-80 uppercase tracking-widest mb-1">{kpi.label}</div>
                        <div className="text-4xl font-black font-mono">{kpi.val}</div>
                     </div>
                   ))}
                </div>

                {/* Table Data */}
                <div className="bg-white border border-slate-100 rounded-3xl overflow-hidden shadow-sm">
                  <div className="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                    <h3 className="text-xs font-black uppercase tracking-[0.2em] text-slate-700">Data Armada Outbound</h3>
                    <div className="relative">
                      <SearchIcon className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4" />
                      <input 
                        type="text" 
                        placeholder="Cari Nopol / LC..." 
                        value={searchQuery}
                        onChange={e => setSearchQuery(e.target.value)}
                        className="pl-10 pr-4 py-2 border border-slate-200 rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-rose-500 w-64 bg-white"
                      />
                    </div>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-white text-slate-400 font-black uppercase tracking-widest border-b border-slate-100">
                        <tr>
                          <th className="py-4 px-6">Status</th>
                          <th className="py-4 px-6">No LC</th>
                          <th className="py-4 px-6">Plat Nomor</th>
                          <th className="py-4 px-6">Tujuan</th>
                          <th className="py-4 px-6">Pintu</th>
                          <th className="py-4 px-6 text-center">Durasi (Menit)</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-50 font-bold">
                        {filteredDeliveries.map((item, i) => (
                          <tr key={i} className="hover:bg-slate-50 transition-colors">
                            <td className="py-4 px-6">
                              <span className={`px-3 py-1 rounded-full text-[10px] uppercase tracking-widest ${
                                item.status === 'SELESAI' ? 'bg-emerald-100 text-emerald-700' :
                                item.status === 'PROSES' ? 'bg-amber-100 text-amber-700' :
                                item.status === 'ANTRI' || item.status === 'ANTRE' ? 'bg-orange-100 text-orange-700' :
                                'bg-rose-100 text-rose-700'
                              }`}>
                                {item.status}
                              </span>
                            </td>
                            <td className="py-4 px-6 font-mono text-slate-500">{item.id}</td>
                            <td className="py-4 px-6 text-slate-800">{item.plateNumber}</td>
                            <td className="py-4 px-6 text-slate-600">{item.destination}</td>
                            <td className="py-4 px-6">
                               <span className="px-3 py-1 bg-slate-100 text-slate-600 rounded-xl text-[10px] tracking-widest">{item.pintu || '-'}</span>
                            </td>
                            <td className="py-4 px-6 text-center font-mono">
                               <span className={item.berjalan > 60 ? 'text-rose-600' : 'text-emerald-600'}>{item.berjalan || 0}</span>
                            </td>
                          </tr>
                        ))}
                        {filteredDeliveries.length === 0 && (
                          <tr>
                            <td colSpan="6" className="py-12 text-center text-slate-400 uppercase tracking-widest font-black text-xs">Tidak ada data armada</td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'analytics' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 animate-in fade-in duration-500">
                <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm h-80 flex flex-col">
                  <h3 className="text-xs font-black uppercase tracking-[0.2em] text-slate-500 mb-6 flex items-center gap-2">
                    <ChartBarIcon className="text-rose-500" /> Distribusi Status
                  </h3>
                  <div className="flex-1 w-full">
                    <ResponsiveContainer width="100%" height="100%">
                      <PieChart>
                        <Pie data={statusData} cx="50%" cy="50%" innerRadius={60} outerRadius={80} paddingAngle={5} dataKey="value">
                          {statusData.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.color} stroke="none" />)}
                        </Pie>
                        <Tooltip contentStyle={{ borderRadius: '12px', border: 'none', boxShadow: '0 10px 15px -3px rgb(0 0 0 / 0.1)' }} />
                        <Legend iconType="circle" wrapperStyle={{ fontSize: '10px', fontWeight: 'bold' }} />
                      </PieChart>
                    </ResponsiveContainer>
                  </div>
                </div>

                <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm h-80 flex flex-col">
                  <h3 className="text-xs font-black uppercase tracking-[0.2em] text-slate-500 mb-6 flex items-center gap-2">
                    <ChartBarIcon className="text-rose-500" /> Volume per Pintu
                  </h3>
                  <div className="flex-1 w-full">
                    <ResponsiveContainer width="100%" height="100%">
                      <BarChart data={pintuData} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                        <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{ fill: '#94a3b8', fontSize: 10, fontWeight: 'bold' }} />
                        <YAxis axisLine={false} tickLine={false} tick={{ fill: '#94a3b8', fontSize: 10, fontWeight: 'bold' }} />
                        <Tooltip cursor={{ fill: '#f8fafc' }} contentStyle={{ borderRadius: '12px', border: 'none', boxShadow: '0 10px 15px -3px rgb(0 0 0 / 0.1)' }} />
                        <Bar dataKey="total" name="Total" fill="#3b82f6" radius={[4, 4, 0, 0]} />
                        <Bar dataKey="selesai" name="Selesai" fill="#10b981" radius={[4, 4, 0, 0]} />
                      </BarChart>
                    </ResponsiveContainer>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!--
  =============================================================================
  KODE UNTUK GOOGLE APPS SCRIPT (code.gs)
  =============================================================================
  Petunjuk Deploy:
  1. Buka Google Apps Script (script.google.com) dan buat project baru.
  2. Copy-paste semua kode di bawah ini ke dalam file Code.gs.
  3. Klik tombol "Deploy" -> "New Deployment".
  4. Pilih tipe "Web App".
  5. Konfigurasi: 
     - Execute as: Me
     - Who has access: Anyone
  6. Klik "Deploy" dan salin URL Web App yang dihasilkan.
  7. Masukkan URL tersebut ke variabel API_URL di atas (Baris 51).
  =============================================================================
  
  function doGet(e) {
    return ContentService.createTextOutput("LCC Backend is Running. Gunakan POST untuk API.").setMimeType(ContentService.MimeType.TEXT);
  }

  function doPost(e) {
    var response;
    try {
      var params = JSON.parse(e.postData.contents);
      var action = params.action;
      var payload = params.data;
      var result;

      switch(action) {
        case 'getDeliveries':
          result = getDeliveries();
          break;
        case 'updateDeliveryStatus':
          result = updateDeliveryStatus(payload.id, payload.status);
          break;
        default:
          throw new Error('Action "' + action + '" tidak dikenali.');
      }
      response = { success: true, data: result };
    } catch (err) {
      response = { success: false, error: err.toString() };
    }
    
    // Header CORS (CORS di Apps Script di-handle secara implisit dengan MimeType JSON)
    return ContentService.createTextOutput(JSON.stringify(response)).setMimeType(ContentService.MimeType.JSON);
  }

  // --- Fungsi Logika ---
  function getDeliveries() {
    var sheet = getLedgerSheet();
    var lastRow = sheet.getLastRow();
    if (lastRow <= 1) return [];
    var data = sheet.getRange(2, 1, lastRow - 1, 26).getValues();
    
    return data.filter(function(row) {
      return String(row[1] || "").trim() !== "";
    }).map(function(row) {
      return {
        id: String(row[1]),
        tanggal: row[0],
        plateNumber: row[9],
        destination: row[6],
        status: row[13] ? 'SELESAI' : (row[12] ? 'PROSES' : (row[10] ? 'ANTRE' : 'BELUM DATANG')),
        pintu: row[20],
        open: row[11],
        close: row[14],
        berjalan: row[17] || 0
      };
    });
  }

  function getLedgerSheet() {
    var ss;
    try {
      ss = SpreadsheetApp.openById("1WHA1wavmqjxwgqBSEeeVbrSqG7n-x1QGjMYtOBMgo2o");
    } catch (e) {
      ss = SpreadsheetApp.getActiveSpreadsheet();
    }
    return ss.getSheetByName("DATABASE") || ss.getActiveSheet();
  }

  function updateDeliveryStatus(id, newStatus) {
    var sheet = getLedgerSheet();
    var data = sheet.getDataRange().getValues();
    for (var i = 1; i < data.length; i++) {
      if (String(data[i][1]) === id) {
        var rowNum = i + 1;
        var now = new Date();
        if (newStatus === 'ANTRI' || newStatus === 'ANTRE') sheet.getRange(rowNum, 11).setValue(now);
        else if (newStatus === 'PROSES') sheet.getRange(rowNum, 13).setValue(now);
        else if (newStatus === 'SELESAI') sheet.getRange(rowNum, 14).setValue(now);
        return true;
      }
    }
    return false;
  }
  -->
</body>
</html>
